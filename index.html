<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Editing — Elite Production CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #050508;
      --c1: #0B0B11;
      --c2: #12121A;
      --c3: #181824;
      --c4: #202030;
      --c5: #2B2B40;
      --ln: rgba(212, 175, 55, 0.06);
      --ln2: rgba(255, 255, 255, 0.06);
      --ln3: rgba(255, 255, 255, 0.12);
      --tx: #F2F2F7;
      --t2: #A1A1AA;
      --t3: #6F6F76;
      --t4: #3E3E42;
      --ac: #D4AF37; /* Premium Gold / Champagne Accent */
      --ach: #C5A028;
      --acl: rgba(212, 175, 55, 0.08);
      --acl2: rgba(212, 175, 55, 0.04);
      --glass: rgba(11, 11, 17, 0.85);
      --blur: blur(24px);
      --sh: 0 4px 30px rgba(0, 0, 0, 0.5);
      --sh2: 0 20px 50px rgba(0, 0, 0, 0.8);
      --sh-glow: 0 0 30px rgba(212, 175, 55, 0.1);
      --gr: #34C759;
      --grl: rgba(52, 199, 89, 0.08);
      --bl: #0A84FF;
      --bll: rgba(10, 132, 255, 0.08);
      --ye: #FF9F0A;
      --yel: rgba(255, 159, 10, 0.08);
      --re: #FF453A;
      --rel: rgba(255, 69, 58, 0.08);
    }

    .light-mode {
      --bg: #F8F9FA;
      --c1: #FFFFFF;
      --c2: #F1F3F5;
      --c3: #E9ECEF;
      --c4: #DEE2E6;
      --c5: #CED4DA;
      --ln: rgba(165, 120, 42, 0.1);
      --ln2: rgba(0, 0, 0, 0.05);
      --ln3: rgba(0, 0, 0, 0.12);
      --tx: #1A1A1E;
      --t2: #495057;
      --t3: #868E96;
      --t4: #ADB5BD;
      --ac: #A5782A;
      --ach: #8C621F;
      --acl: rgba(165, 120, 42, 0.08);
      --acl2: rgba(165, 120, 42, 0.03);
      --glass: rgba(255, 255, 255, 0.9);
      --blur: blur(24px);
      --sh: 0 4px 20px rgba(0, 0, 0, 0.03);
      --sh2: 0 16px 40px rgba(0, 0, 0, 0.06);
    }

    html, body, #root { height: 100%; width: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background-color 0.4s ease; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--ln3); border-radius: 10px; }
    input, select, textarea { outline: none; font-family: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade { animation: fadeUp .6s cubic-bezier(.16, 1, .3, 1) both; }
    
    [contenteditable="true"] {
      border-radius: 4px;
      padding: 1px 4px;
      transition: all 0.2s ease;
      display: inline-block;
    }
    [contenteditable="true"]:hover {
      background: var(--ln2);
      box-shadow: 0 0 0 1px var(--ln3);
    }
    [contenteditable="true"]:focus {
      background: var(--c3);
      outline: none;
      box-shadow: 0 0 0 1px var(--ac);
    }

    .luxury-input {
      background: var(--c2);
      border: 1px solid var(--ln2);
      padding: 12px 16px;
      border-radius: 8px;
      color: var(--tx);
      font-size: 13px;
      letter-spacing: 0.03em;
      transition: all 0.25s ease;
    }
    .luxury-input:focus {
      border-color: var(--ac);
      background: var(--c3);
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const GLOBAL_AUTH_KEY = "vanguard_auth_session";
const USER_DATA_PREFIX = "vanguard_studio_data_";

const defaultUserDataStructure = {
  profile: { name: "Creative Director", studio: "Vanguard Editing", avatar: "VE", color: "#D4AF37", lightMode: false, showGlows: true },
  dashboardTitles: { totalRevenue: "Retainers Settled", pending: "Escrow Pipeline", netProfit: "Net Yield", hoursLogged: "Chronos Track" },
  clients: [
    { id: 1, name: "Aether Cinema Corp", type: "VFX Production House", email: "management@aether.film", status: "Active" },
    { id: 2, name: "Kaufman Luxury Group", type: "Commercial Campaign", email: "ops@kaufman.co", status: "Active" }
  ],
  projects: [
    { id: 1, title: "The Sovereign Identity — Master Cut", client: "Aether Cinema Corp", status: "In Progress", value: 8400, editProgress: 45, deadline: "2026-08-15", priority: "High" },
    { id: 2, title: "Excellence Heritage Campaign 60s", client: "Kaufman Luxury Group", status: "Review", value: 4500, editProgress: 90, deadline: "2026-06-02", priority: "High" }
  ],
  logs: [
    { id: 1, client: "Aether Cinema Corp", project: "The Sovereign Identity", task: "Color Grading Pass Suite", duration: 14400, date: "2026-05-22" }
  ],
  earnings: [
    { id: 1, label: "Kaufman Group — Retainer Milestone 1", amount: 4500, date: "2026-05-10", status: "Paid" },
    { id: 2, label: "Aether Cinema — Production Front End", amount: 8400, date: "2026-05-18", status: "Pending" }
  ],
  expenses: [
    { id: 1, name: "DaVinci Resolve Server Core Array", amount: 29.99, cat: "Software", date: "2026-05-01" },
    { id: 2, name: "LTO-9 High Density Storage Lease", amount: 120.00, cat: "Hardware Array", date: "2026-05-01" }
  ],
  delivery: [
    { id: 1, client: "Kaufman Luxury Group", project: "Heritage Promo V3 Super High", url: "https://vanguard.frame.io/kaufman-60s", status: "Awaiting Review", sent: "2026-05-21" }
  ],
  templates: [
    { id: 1, title: "Premium Master Release Cut", subject: "Cinematic Masters Dispatched // {project}", body: "Dear {name},\n\nThe raw ultra-fidelity exhibition files and associated structural passes for \"{project}\" have successfully generated.\n\nAccess the secure cloud vault mirror below:\n{link}\n\nSalutations,\n{studio}" }
  ],
  goals: { monthlyRevenue: 25000 }
};

const Badge = ({ color = "dim", children }) => {
  const scheme = {
    green: ["var(--grl)", "var(--gr)"], blue: ["var(--bll)", "var(--bl)"],
    yellow: ["var(--yel)", "var(--ye)"], red: ["var(--rel)", "var(--re)"],
    ac: ["var(--acl)", "var(--ac)"], dim: ["var(--ln2)", "var(--t2)"]
  }[color] || ["var(--ln2)", "var(--t2)"];
  return <span style={{ background: scheme[0], color: scheme[1], display: "inline-flex", alignItems: "center", fontSize: 10, fontWeight: 600, padding: "3px 9px", borderRadius: 4, textTransform: "uppercase", letterSpacing: "0.06em" }}>{children}</span>
};

const Editable = ({ text, onSave, tag: Tag = "span", numeric = false, style = {} }) => {
  const blurHandler = (e) => {
    let val = e.target.innerText.trim();
    if (numeric) { val = parseFloat(val.replace(/[^0-9.-]/g, "")) || 0; }
    onSave(val);
  };
  const keyHandler = (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
  return <Tag contentEditable="true" suppressContentEditableWarning onBlur={blurHandler} onKeyDown={keyHandler} style={{ minWidth: "15px", display: "inline-block", ...style }}>{text}</Tag>;
};

const Card = ({ children, style = {}, glow = false, globalGlow = true }) => (
  <div style={{ background: "var(--c1)", border: `1px solid var(--ln)`, borderRadius: 12, padding: "1.5rem", boxShadow: (glow && globalGlow) ? "var(--sh-glow)" : "var(--sh)", transition: "all 0.3s ease", ...style }}>
    {children}
  </div>
);

const Btn = ({ children, variant = "ghost", onClick, style = {} }) => {
  const styles = {
    primary: { background: "var(--ac)", color: "var(--bg)", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", fontSize: "11px" },
    ghost: { background: "var(--c3)", color: "var(--tx)", border: `1px solid var(--ln2)` },
    danger: { background: "var(--rel)", color: "var(--re)", border: `1px solid rgba(255,59,48,0.15)` }
  }[variant];
  return <button onClick={onClick} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8, fontSize: 12, padding: "10px 18px", borderRadius: 6, transition: "all 0.2s", fontWeight: 500, ...styles, ...style }} onMouseEnter={e => e.currentTarget.style.opacity = 0.85} onMouseLeave={e => e.currentTarget.style.opacity = 1}>{children}</button>
};

const Field = ({ label, children }) => (
  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}><p style={{ fontSize: 10, color: "var(--t3)", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</p>{children}</div>
);

function App() {
  const [currentUser, setCurrentUser] = useState(() => localStorage.getItem(GLOBAL_AUTH_KEY));
  const [data, setData] = useState(null);
  const [page, setPage] = useState("home");

  // Load User Data upon dynamic auth validation
  useEffect(() => {
    if (currentUser) {
      const userStorageKey = USER_DATA_PREFIX + currentUser.toLowerCase().trim();
      const savedData = localStorage.getItem(userStorageKey);
      if (savedData) {
        setData(JSON.parse(savedData));
      } else {
        const freshData = { ...defaultUserDataStructure };
        localStorage.setItem(userStorageKey, JSON.stringify(freshData));
        setData(freshData);
      }
    } else {
      setData(null);
    }
  }, [currentUser]);

  // Sync data updates to personal user track channel
  useEffect(() => {
    if (currentUser && data) {
      const userStorageKey = USER_DATA_PREFIX + currentUser.toLowerCase().trim();
      localStorage.setItem(userStorageKey, JSON.stringify(data));
      if (data.profile?.lightMode) document.body.classList.add("light-mode");
      else document.body.classList.remove("light-mode");
    }
  }, [data, currentUser]);

  const handleLogout = () => {
    localStorage.removeItem(GLOBAL_AUTH_KEY);
    setCurrentUser(null);
    document.body.classList.remove("light-mode");
  };

  if (!currentUser || !data) {
    return <AuthGate onAuthSuccess={(username) => {
      localStorage.setItem(GLOBAL_AUTH_KEY, username);
      setCurrentUser(username);
    }} />;
  }

  const updateProfile = (key, val) => setData(d => ({ ...d, profile: { ...d.profile, [key]: val } }));
  const updateGoal = (val) => setData(d => ({ ...d, goals: { ...d.goals, monthlyRevenue: val } }));
  const updateDashboardTitle = (key, val) => setData(d => ({ ...d, dashboardTitles: { ...d.dashboardTitles, [key]: val } }));

  const paidEarnings = data.earnings?.filter(e => e.status === "Paid").reduce((acc, curr) => acc + Number(curr.amount), 0) || 0;
  const pendingEarnings = data.earnings?.filter(e => e.status === "Pending").reduce((acc, curr) => acc + Number(curr.amount), 0) || 0;
  const absoluteExpenses = data.expenses?.reduce((acc, curr) => acc + Number(curr.amount), 0) || 0;
  const systemNetProfit = paidEarnings - absoluteExpenses;
  const loggedTotalSeconds = data.logs?.reduce((acc, curr) => acc + Number(curr.duration), 0) || 0;

  return (
    <div style={{ display: "flex", height: "100vh", width: "100vw", background: "var(--bg)", color: "var(--tx)" }}>
      {/* Sidebar Navigation */}
      <div style={{ width: 260, background: "var(--c1)", borderRight: `1px solid var(--ln)`, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
        <div>
          <div style={{ padding: "2rem 1.5rem", display: "flex", alignItems: "center", gap: 12, borderBottom: `1px solid var(--ln)` }}>
            <div style={{ width: 34, height: 34, borderRadius: 6, background: "var(--ac)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: data.profile.showGlows ? "var(--sh-glow)" : "none" }}>
              <i className="ti ti-layers-linked" style={{ color: "var(--bg)", fontSize: 18 }} />
            </div>
            <div>
              <Editable text={data.profile.studio || "Vanguard Editing"} onSave={v => updateProfile("studio", v)} tag="p" style={{ fontSize: 12, fontWeight: 700, color: "var(--tx)", letterSpacing: "0.06em", textTransform: "uppercase" }} />
              <p style={{ fontSize: 9, color: "var(--t3)", fontWeight: 500, letterSpacing: "0.08em", textTransform: "uppercase", marginTop: 2 }}>Secure Workspace Network</p>
            </div>
          </div>

          <div style={{ padding: "1.25rem 1rem", display: "flex", flexDirection: "column", gap: 4 }}>
            {[
              { id: "home", icon: "ti-square-dashboard", label: "Studio Control" },
              { id: "clients", icon: "ti-building-skyscraper", label: "Client Ledger" },
              { id: "projects", icon: "ti-timeline-event", label: "Production Pipelines" },
              { id: "finances", icon: "ti-database-dollar", label: "Asset Accounts" },
              { id: "delivery", icon: "ti-transform", label: "Dispatches" },
              { id: "templates", icon: "ti-archive", label: "Communications" },
              { id: "analytics", icon: "ti-presentation-analytics", label: "Vanguard Analytics" }
            ].map(item => {
              const active = page === item.id;
              return (
                <button key={item.id} onClick={() => setPage(item.id)} style={{ display: "flex", alignItems: "center", gap: 14, width: "100%", padding: "11px 16px", borderRadius: 6, background: active ? "var(--acl)" : "transparent", color: active ? "var(--ac)" : "var(--t2)", transition: "all 0.2s ease", textAlign: "left" }}>
                  <i className={`ti ${item.icon}`} style={{ fontSize: 18, color: active ? "var(--ac)" : "var(--t3)" }} />
                  <span style={{ fontSize: 12, fontWeight: active ? 600 : 400, letterSpacing: "0.03em" }}>{item.label}</span>
                </button>
              )
            })}
          </div>
        </div>

        <div style={{ padding: "1.25rem 1rem", borderTop: `1px solid var(--ln)`, display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }} onClick={() => setPage("settings")}>
            <div style={{ width: 38, height: 38, borderRadius: "50%", background: "var(--c3)", border: `1px solid var(--ln)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "var(--ac)" }}>
              {data.profile.avatar || "VE"}
            </div>
            <div style={{ flex: 1, overflow: "hidden" }}>
              <p style={{ fontSize: 13, fontWeight: 600, color: "var(--tx)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{data.profile.name}</p>
              <p style={{ fontSize: 10, color: "var(--t3)", letterSpacing: "0.02em" }}>Director Parameters</p>
            </div>
          </div>
          <Btn variant="danger" onClick={handleLogout} style={{ width: "100%", padding: "8px", fontSize: 11 }}><i className="ti ti-logout" /> Sever Link</Btn>
        </div>
      </div>

      {/* Main Framework Block Area */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflowY: "auto", padding: "3rem" }}>
        {page === "home" && <ViewHome data={data} setData={setData} paid={paidEarnings} pending={pendingEarnings} net={systemNetProfit} hours={loggedTotalSeconds} updateTitle={updateDashboardTitle} updateGoal={updateGoal} />}
        {page === "clients" && <ViewClients data={data} setData={setData} />}
        {page === "projects" && <ViewProjects data={data} setData={setData} />}
        {page === "finances" && <ViewFinances data={data} setData={setData} paid={paidEarnings} pending={pendingEarnings} expenses={absoluteExpenses} net={systemNetProfit} />}
        {page === "delivery" && <ViewDelivery data={data} setData={setData} />}
        {page === "templates" && <ViewTemplates data={data} setData={setData} />}
        {page === "analytics" && <ViewAnalytics data={data} paid={paidEarnings} pending={pendingEarnings} expenses={absoluteExpenses} net={systemNetProfit} />}
        {page === "settings" && <ViewSettings data={data} setData={setData} updateProfile={updateProfile} />}
      </div>
    </div>
  );
}

// Authentication Matrix UI Gate
function AuthGate({ onAuthSuccess }) {
  const [isRegister, setIsRegister] = useState(false);
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const handleAuthSubmit = (e) => {
    e.preventDefault();
    setError("");
    const userKey = username.toLowerCase().trim();
    if (!userKey || !password) { setError("Fill credentials completely."); return; }

    const registryKey = "vanguard_user_registry";
    let registry = JSON.parse(localStorage.getItem(registryKey) || "{}");

    if (isRegister) {
      if (registry[userKey]) { setError("Account key occupied."); return; }
      registry[userKey] = password;
      localStorage.setItem(registryKey, JSON.stringify(registry));
      onAuthSuccess(username);
    } else {
      if (!registry[userKey] || registry[userKey] !== password) {
        setError("Invalid identity matching keys.");
        return;
      }
      onAuthSuccess(username);
    }
  };

  return (
    <div style={{ height: "100vh", width: "100vw", display: "flex", alignItems: "center", justifyContent: "center", background: "#050508" }} className="fade">
      <div style={{ width: 380, background: "#0B0B11", border: "1px solid rgba(212, 175, 55, 0.15)", borderRadius: 16, padding: "2.5rem 2rem", boxShadow: "0 20px 60px rgba(0,0,0,0.7)" }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: "2rem" }}>
          <div style={{ width: 44, height: 44, borderRadius: 8, background: "#D4AF37", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16, boxShadow: "0 0 20px rgba(212,175,55,0.2)" }}>
            <i className="ti ti-layers-linked" style={{ color: "#050508", fontSize: 24 }} />
          </div>
          <h2 style={{ fontSize: 16, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "#F2F2F7" }}>Vanguard Editing</h2>
          <p style={{ fontSize: 11, color: "#6F6F76", letterSpacing: "0.04em", marginTop: 4 }}>Elite CRM Terminal Matrix</p>
        </div>

        <form onSubmit={handleAuthSubmit} style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <Field label="Operator Identifier Account">
            <input className="luxury-input" value={username} onChange={e => setUsername(e.target.value)} placeholder="Username / Studio Node" />
          </Field>
          <Field label="System Passcode Matrix">
            <input className="luxury-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
          </Field>

          {error && <p style={{ fontSize: 11, color: "var(--re)", textAlign: "center", letterSpacing: "0.02em" }}>{error}</p>}

          <Btn variant="primary" style={{ height: 42, marginTop: 8 }}>{isRegister ? "Construct Account Space" : "Access Personal Engine"}</Btn>
        </form>

        <div style={{ textAlign: "center", marginTop: "1.5rem", borderTop: "1px solid rgba(255,255,255,0.04)", paddingTop: "1rem" }}>
          <button style={{ fontSize: 12, color: "#A1A1AA", letterSpacing: "0.02em" }} onClick={() => { setIsRegister(!isRegister); setError(""); }}>
            {isRegister ? "Already registered? Verify credentials" : "Need private system space? Register"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ViewHome({ data, setData, paid, pending, net, hours, updateTitle, updateGoal }) {
  const activeProjs = data.projects?.filter(p => p.status !== "Completed") || [];
  const revProgress = Math.min(100, (paid / (data.goals?.monthlyRevenue || 1)) * 100);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 32 }} className="fade">
      <div>
        <h1 style={{ fontSize: 22, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase" }}>Executive Dash</h1>
        <p style={{ fontSize: 12, color: "var(--t3)", marginTop: 4, letterSpacing: "0.02em" }}>High performance metrics tracking securely via user localized instances.</p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 20 }}>
        <Card glow>
          <Editable text={data.dashboardTitles.totalRevenue} onSave={v => updateTitle("totalRevenue", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase", letterSpacing: "0.05em" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 2, marginTop: 10, color: "var(--ac)" }}>
            <span style={{ fontSize: 20, fontWeight: 400 }}>$</span>
            <Editable text={paid} numeric onSave={v => {
              setData(d => ({ ...d, earnings: [{ id: Date.now(), label: "Base Adjusted Inflow Override", amount: v, date: "2026-05-22", status: "Paid" }, ...(d.earnings || [])] }));
            }} style={{ fontSize: 24, fontWeight: 700, letterSpacing: "-0.01em" }} />
          </div>
        </Card>

        <Card>
          <Editable text={data.dashboardTitles.pending} onSave={v => updateTitle("pending", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase", letterSpacing: "0.05em" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 2, marginTop: 10, color: "var(--ye)" }}>
            <span style={{ fontSize: 20, fontWeight: 400 }}>$</span>
            <Editable text={pending} numeric onSave={v => {
              setData(d => ({ ...d, earnings: [...(d.earnings || []).filter(e => e.status !== "Pending"), { id: Date.now(), label: "Escrow Dynamic Override Balance", amount: v, date: "2026-05-22", status: "Pending" }] }));
            }} style={{ fontSize: 24, fontWeight: 700, letterSpacing: "-0.01em" }} />
          </div>
        </Card>

        <Card>
          <Editable text={data.dashboardTitles.netProfit} onSave={v => updateTitle("netProfit", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase", letterSpacing: "0.05em" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 2, marginTop: 10, color: "var(--tx)" }}>
            <span style={{ fontSize: 20, fontWeight: 400 }}>$</span>
            <span style={{ fontSize: 24, fontWeight: 700, letterSpacing: "-0.01em" }}>{net.toLocaleString()}</span>
          </div>
        </Card>

        <Card>
          <Editable text={data.dashboardTitles.hoursLogged} onSave={v => updateTitle("hoursLogged", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase", letterSpacing: "0.05em" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginTop: 10, color: "var(--t2)" }}>
            <span style={{ fontSize: 24, fontWeight: 700 }}>{Math.floor(hours / 3600)}</span>
            <span style={{ fontSize: 12, fontWeight: 400, color: "var(--t3)" }}>units tracked</span>

              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <Editable text={del.project} onSave={v => updateDeliveryField(del.id, "project", v)} style={{ fontSize: 14, fontWeight: 600, letterSpacing: "0.01em" }} />
                <Badge color={del.status === "Approved" ? "green" : "yellow"}>{del.status}</Badge>
              </div>
              <div style={{ fontSize: 11, color: "var(--t2)", display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
                <span>Node Vector: <strong style={{ color: "var(--tx)" }}>{del.client}</strong></span>
                <span style={{ color: "var(--t4)" }}>•</span>
                <i className="ti ti-link" style={{ color: "var(--ac)" }} />
                <Editable text={del.url} onSave={v => updateDeliveryField(del.id, "url", v)} style={{ color: "var(--ac)", fontFamily: "monospace", fontSize: "11px" }} />
              </div>
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
              <select value={del.status} onChange={e => updateDeliveryField(del.id, "status", e.target.value)} style={{ background: "var(--c2)", border: "1px solid var(--ln3)", color: "var(--tx)", fontSize: 11, padding: "4px 8px", borderRadius: 4 }}>
                <option value="Awaiting Review">Awaiting Review</option>
                <option value="Approved">Approved</option>
                <option value="Changes Requested">Changes Requested</option>
              </select>
              <button onClick={() => setData(d => ({ ...d, delivery: d.delivery.filter(item => item.id !== del.id) }))} style={{ color: "var(--t4)" }}>
                <i className="ti ti-trash" style={{ fontSize: 16 }} />
              </button>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function ViewTemplates({ data, setData }) {

        <p style={{ fontSize: 12, color: "var(--t3)", marginTop: 4 }}>Prestige blueprint messaging matrices for corporate signaling transmissions.</p>
      </div>

      <Card>

        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <input className="luxury-input" value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Internal Protocol Layout Label" />
            <input className="luxury-input" value={form.subject} onChange={e => setForm({ ...form, subject: e.target.value })} placeholder="Email Subject Transmission Line Header" />
          </div>

          <Btn variant="primary" onClick={() => {
            if (!form.title) return;
            setData(d => ({ ...d, templates: [{ id: Date.now(), title: form.title, subject: form.subject || "Campaign Update Sync", body: form.body || "Salutations." }, ...(d.templates || [])] }));

      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 20 }}>
        {(data.templates || []).map(t => (
          <Card key={t.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid var(--ln)", paddingBottom: 12, marginBottom: 12 }}>
              <Editable text={t.title} onSave={v => setData(d => ({ ...d, templates: d.templates.map(item => item.id === t.id ? { ...item, title: v } : item) }))} style={{ fontSize: 13, fontWeight: 600, color: "var(--ac)", letterSpacing: "0.04em", textTransform: "uppercase" }} />
              <button onClick={() => setData(d => ({ ...d, templates: d.templates.filter(item => item.id !== t.id) }))} style={{ color: "var(--t4)" }}>
                <i className="ti ti-square-x" style={{ fontSize: 18 }} />
              </button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ fontSize: 12, color: "var(--t2)" }}>
                <span style={{ color: "var(--t3)", fontWeight: 700, textTransform: "uppercase", fontSize: "10px", letterSpacing: "0.04em" }}>Header Sync:</span> <Editable text={t.subject} onSave={v => setData(d => ({ ...d, templates: d.templates.map(item => item.id === t.id ? { ...item, subject: v } : item) }))} style={{ marginLeft: 6, fontWeight: 500 }} />
              </div>
              <div style={{ background: "var(--c2)", border: "1px solid var(--ln2)", borderRadius: 6, padding: 16, fontSize: 12, color: "var(--tx)", whiteSpace: "pre-wrap", fontFamily: "monospace", lineHeight: "1.5" }}>
                <Editable text={t.body} onSave={v => setData(d => ({ ...d, templates: d.templates.map(item => item.id === t.id ? { ...item, body: v } : item) }))} style={{ width: "100%", display: "block" }} />
              </div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function ViewAnalytics({ data, paid, pending, expenses, net }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (chartRef.current) {
      if (chartInstance.current) chartInstance.current.destroy();

      const isDark = !document.body.classList.contains("light-mode");
      const gridColor = isDark ? "rgba(255, 255, 255, 0.03)" : "rgba(0, 0, 0, 0.04)";
      const labelColor = isDark ? "#6F6F76" : "#868E96";

      const ctx = chartRef.current.getContext("2d");
      chartInstance.current = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Liquid Yield", "Escrow Hold", "Overhead Cost", "Net Yield Balance"],
          datasets: [{
            data: [paid, pending, expenses, net],
            backgroundColor: ["#D4AF37", "#FF9F0A", "#FF453A", "#F2F2F7"],
            borderRadius: 4,
            barThickness: 24
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: gridColor }, ticks: { color: labelColor, font: { family: "monospace", size: 10 } } },
            x: { grid: { display: false }, ticks: { color: labelColor, font: { family: "-apple-system", size: 11 } } }
          }
        }
      });
    }
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [paid, pending, expenses, net]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 32 }} className="fade">
      <div>
        <h1 style={{ fontSize: 22, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase" }}>Vanguard Engine Analytics</h1>
        <p style={{ fontSize: 12, color: "var(--t3)", marginTop: 4 }}>Localized algorithmic balance computations matrix tracking absolute studio conversions.</p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 24 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <Card>
            <p style={{ fontSize: 10, color: "var(--t3)", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em" }}>Liquid Pipeline Efficiency</p>
            <p style={{ fontSize: 24, fontWeight: 700, marginTop: 8, color: "var(--ac)" }}>
              {((paid / (paid + pending || 1)) * 100).toFixed(1)}%
            </p>
          </Card>
          <Card>
            <p style={{ fontSize: 10, color: "var(--t3)", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em" }}>Overhead Capital Index</p>
            <p style={{ fontSize: 24, fontWeight: 700, marginTop: 8, color: "var(--re)" }}>
              {((expenses / (paid || 1)) * 100).toFixed(1)}%
            </p>
          </Card>
        </div>

        <Card style={{ minHeight: 300, display: "flex", flexDirection: "column" }}>
          <p style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 20 }}>Studio Balance Profile Visualizer Array</p>
          <div style={{ flex: 1, position: "relative" }}>
            <canvas ref={chartRef}></canvas>
          </div>
        </Card>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(container);
root.render(<App />);
