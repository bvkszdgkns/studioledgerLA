<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EditDesk Ultra Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; background: #07070b; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; color: #f0f0f4; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 2px; }
    input, select, textarea { outline: none; font-family: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .fade { animation: fadeUp .35s cubic-bezier(.16, 1, .3, 1) both; }
    .fade2 { animation: fadeUp .35s .07s cubic-bezier(.16, 1, .3, 1) both; }
    .fade3 { animation: fadeUp .35s .14s cubic-bezier(.16, 1, .3, 1) both; }
    .fade4 { animation: fadeUp .35s .21s cubic-bezier(.16, 1, .3, 1) both; }
    .fade5 { animation: fadeUp .35s .28s cubic-bezier(.16, 1, .3, 1) both; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const T = {
  bg: "#07070b", c1: "#0d0d12", c2: "#13131a", c3: "#1a1a24", c4: "#23232f", c5: "#2c2c3a",
  ln: "rgba(255,255,255,.045)", ln2: "rgba(255,255,255,.09)", ln3: "rgba(255,255,255,.15)",
  tx: "#f0f0f4", t2: "#9ca3af", t3: "#6b7280", t4: "#3f3f50",
  ac: "#ff4f2b", ach: "#e83d1a", acl: "rgba(255,79,43,.1)", acl2: "rgba(255,79,43,.06)",
  gr: "#10b981", grl: "rgba(16,185,129,.1)",
  bl: "#3b82f6", bll: "rgba(59,130,246,.1)",
  ye: "#f59e0b", yel: "rgba(245,158,11,.1)",
  re: "#ef4444", rel: "rgba(239,68,68,.1)",
  pu: "#a78bfa", pul: "rgba(167,139,250,.1)",
  cy: "#06b6d4", cyl: "rgba(6,182,212,.1)",
  ff: "'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif",
  r4: "4px", r6: "6px", r8: "8px", r12: "12px", r16: "16px", r20: "20px"
};

const STORAGE_KEY = "editdesk_ultra_pro_v1";
const USERS_KEY = "editdesk_users_v1";
const getUsers = () => { try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}") } catch { return {} } };
const saveUsers = u => { try { localStorage.setItem(USERS_KEY, JSON.stringify(u)) } catch {} };
const getUserData = (uid) => { try { return JSON.parse(localStorage.getItem(`${STORAGE_KEY}_${uid}`) || "null") } catch { return null } };
const saveUserData = (uid, data) => { try { localStorage.setItem(`${STORAGE_KEY}_${uid}`, JSON.stringify(data)) } catch {} };

const defaultUserData = (name) => ({
  profile: { name, studio: "My Studio", avatar: name.slice(0,2).toUpperCase(), timezone: "EST", currency: "USD", hourlyRate: 75 },
  clients: [
    { id: 1, name: "Alex Rivera", type: "YouTube Channel", email: "alex@email.com", phone: "", avatar: "AR", color: "#ff4f2b", status: "Active" },
    { id: 2, name: "Zoe Chen", type: "Commercial Reels", email: "zoe@email.com", phone: "", avatar: "ZC", color: "#10b981", status: "Active" },
    { id: 3, name: "Vanguard Media", type: "Corporate Film", email: "hello@vanguard.com", phone: "", avatar: "VM", color: "#3b82f6", status: "Active" }
  ],
  projects: [
    { id: 1, title: "Episode 47 — Tech Deep Dive", client: "Alex Rivera", status: "In Progress", value: 850, editProgress: 65, deadline: "2026-06-10", notes: "B-roll needs grading pass", priority: "High" },
    { id: 2, title: "May Fashion Haul", client: "Zoe Chen", status: "Review", value: 600, editProgress: 90, deadline: "2026-06-05", notes: "Client requested color pop on cuts", priority: "Medium" },
    { id: 3, title: "Brand Manifesto 2026", client: "Vanguard Media", status: "In Progress", value: 2400, editProgress: 25, deadline: "2026-06-20", notes: "First rough cut due next week", priority: "High" }
  ],
  logs: [
    { id: 1, client: "Alex Rivera", project: "Episode 47 — Tech Deep Dive", task: "VFX Masking & Grade", duration: 5400, date: "2026-05-15" },
    { id: 2, client: "Zoe Chen", project: "May Fashion Haul", task: "B-Roll Audio Sync", duration: 3200, date: "2026-05-14" }
  ],
  earnings: [
    { id: 1, label: "Alex Rivera — April", amount: 1200, date: "2026-04-28", method: "Stripe", status: "Paid" },
    { id: 2, label: "Zoe Chen — April", amount: 600, date: "2026-04-15", method: "PayPal", status: "Paid" },
    { id: 3, label: "Vanguard — Q1 Retainer", amount: 2400, date: "2026-03-31", method: "Wire", status: "Paid" },
    { id: 4, label: "Alex Rivera — May", amount: 850, date: "2026-05-20", method: "Stripe", status: "Pending" },
    { id: 5, label: "Zoe Chen — May", amount: 600, date: "2026-05-18", method: "PayPal", status: "Paid" }
  ],
  expenses: [
    { id: 1, name: "Adobe Creative Cloud", amount: 54.99, cat: "Software", date: "2026-05-01" },
    { id: 2, name: "Epidemic Sound", amount: 15.00, cat: "Audio", date: "2026-05-01" },
    { id: 3, name: "Frame.io", amount: 25.00, cat: "Delivery", date: "2026-05-01" },
    { id: 4, name: "SSD Storage — 2TB", amount: 89.99, cat: "Hardware", date: "2026-05-10" }
  ],
  delivery: [
    { id: 1, client: "Alex Rivera", project: "Episode 47", url: "https://frame.io/share/node-x78b", status: "Awaiting Review", password: "", sent: "2026-05-19" },
    { id: 2, client: "Zoe Chen", project: "May Fashion Haul", url: "https://drive.google.com/drive/prod-reels", status: "Approved", password: "", sent: "2026-05-17" }
  ],
  templates: [
    { id: 1, title: "Review Ready", subject: "Your edit is ready for review — {project}", body: "Hi {name},\n\nYour review cut for \"{project}\" is live. Please leave timestamped notes by {deadline}.\n\nAccess link: {link}\n\nLooking forward to your feedback!\n\n— {studio}" },
    { id: 2, title: "Final Delivery", subject: "Final files delivered — {project}", body: "Hi {name},\n\nAll final exports for \"{project}\" are ready. Your invoice is attached.\n\nDownload: {link}\n\nA pleasure working with you!\n\n— {studio}" }
  ],
  portfolio: [
    { id: 1, title: "AI Content Workflow Strategy", client: "Alex Rivera", views: "284K", url: "https://youtube.com", platform: "YouTube" },
    { id: 2, title: "Spring Capsule Wardrobe Promo", client: "Zoe Chen", views: "192K", url: "https://instagram.com", platform: "Instagram" }
  ],
  integrations: { discord: "", youtube: "", instagram: "", notion: "", slack: "" },
  goals: { monthlyRevenue: 5000, weeklyHours: 40, clientTarget: 5 },
  timer: { running: false, seconds: 0, client: "", task: "" }
});

const Spinner = () => <div style={{ width: 16, height: 16, border: `2px solid ${T.ln2}`, borderTopColor: T.ac, borderRadius: "50%", animation: "spin .7s linear infinite" }} />;

const Badge = ({ children, color = "dim", dot = false }) => {
  const m = { green: [T.grl, T.gr], blue: [T.bll, T.bl], yellow: [T.yel, T.ye], red: [T.rel, T.re], ac: [T.acl, T.ac], purple: [T.pul, T.pu], cyan: [T.cyl, T.cy], dim: ["rgba(255,255,255,.04)", T.t2] };
  const [bg, fg] = m[color] || m.dim;
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: bg, color: fg, fontSize: 10, fontWeight: 600, padding: "2px 7px", borderRadius: T.r4, letterSpacing: ".04em", textTransform: "uppercase" }}>
    {dot && <span style={{ width: 5, height: 5, borderRadius: "50%", background: fg, flexShrink: 0 }} />}
    {children}
  </span>
};

const Avatar = ({ label = "", color = "#ff4f2b", size = 34 }) => {
  return <div style={{ width: size, height: size, borderRadius: "50%", background: color + "22", border: `1px solid ${color}44`, color: color, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: size * .35, flexShrink: 0 }}>{label.slice(0, 2).toUpperCase()}</div>
};

const Btn = ({ children, v = "ghost", sz = "md", style = {}, loading = false, ...p }) => {
  const [hov, sh] = useState(false);
  const sizes = { sm: { padding: "4px 10px", fontSize: 11 }, md: { padding: "7px 14px", fontSize: 12 }, lg: { padding: "10px 20px", fontSize: 13 } };
  const variants = {
    primary: { background: hov ? T.ach : T.ac, color: "#fff", fontWeight: 600 },
    ghost: { background: hov ? "rgba(255,255,255,.05)" : "rgba(255,255,255,.015)", color: T.tx, border: `1px solid ${T.ln}`, fontWeight: 500 },
    danger: { background: hov ? T.rel : "transparent", color: T.re, border: `1px solid ${T.rel}`, fontWeight: 500 },
    subtle: { background: "transparent", color: T.t2, fontWeight: 400 },
    green: { background: hov ? "rgba(16,185,129,.18)" : T.grl, color: T.gr, border: `1px solid rgba(16,185,129,.2)`, fontWeight: 600 }
  };
  return <button {...p} disabled={loading || p.disabled} onMouseEnter={() => sh(true)} onMouseLeave={() => sh(false)}
    style={{ display: "inline-flex", alignItems: "center", gap: 6, borderRadius: T.r8, transition: "all .15s", cursor: p.disabled ? "not-allowed" : "pointer", opacity: p.disabled ? .5 : 1, ...sizes[sz], ...(variants[v] || variants.ghost), ...style }}>
    {loading ? <Spinner /> : children}
  </button>
};

const Input = ({ style = {}, ...p }) => {
  const [f, sf] = useState(false);
  return <input {...p} onFocus={e => { sf(true); p.onFocus && p.onFocus(e) }} onBlur={e => { sf(false); p.onBlur && p.onBlur(e) }}
    style={{ background: T.c3, border: `1px solid ${f ? T.ac : T.ln}`, borderRadius: T.r8, color: T.tx, fontSize: 13, padding: "9px 12px", width: "100%", transition: "border-color .15s", ...style }} />;
};

const Select = ({ children, style = {}, ...p }) => {
  return <select {...p} style={{ background: T.c3, border: `1px solid ${T.ln}`, borderRadius: T.r8, color: T.tx, fontSize: 13, padding: "9px 12px", width: "100%", ...style }}>{children}</select>
};

const Textarea = ({ style = {}, ...p }) => {
  const [f, sf] = useState(false);
  return <textarea {...p} onFocus={() => sf(true)} onBlur={() => sf(false)}
    style={{ background: T.c3, border: `1px solid ${f ? T.ac : T.ln}`, borderRadius: T.r8, color: T.tx, fontSize: 13, padding: "9px 12px", width: "100%", resize: "vertical", minHeight: 80, fontFamily: T.ff, transition: "border-color .15s", ...style }} />;
};

const Card = ({ children, style = {}, onClick, glow = false }) => {
  const [hov, sh] = useState(false);
  return <div onClick={onClick} onMouseEnter={() => sh(true)} onMouseLeave={() => sh(false)}
    style={{ background: T.c1, border: `1px solid ${hov && onClick ? T.ln2 : T.ln}`, borderRadius: T.r12, padding: "1.25rem", transition: "all .2s cubic-bezier(.16,1,.3,1)", cursor: onClick ? "pointer" : "default", transform: hov && onClick ? "translateY(-1px)" : "none", boxShadow: glow && hov ? "0 0 0 1px " + T.ac + "33" : "none", ...style }}>
    {children}
  </div>
};

const Modal = ({ children, onClose, width = 400 }) => <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(3,3,7,.88)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(16px)", padding: "1rem" }}>
  <div onClick={e => e.stopPropagation()} style={{ background: T.c1, border: `1px solid ${T.ln2}`, borderRadius: T.r20, padding: "1.75rem", width, maxWidth: "92vw", maxHeight: "90vh", overflowY: "auto", animation: "fadeUp .25s cubic-bezier(.16,1,.3,1)" }}>
    {children}
  </div>
</div>;

const SectionLabel = ({ children, style = {} }) => <p style={{ margin: "0 0 .5rem", fontSize: 10, fontWeight: 700, color: T.t3, textTransform: "uppercase", letterSpacing: ".1em", ...style }}>{children}</p>;
const Divider = () => <div style={{ height: 1, background: T.ln, margin: "1rem 0" }} />;

const ProgressBar = ({ value = 0, color = T.ac, height = 3 }) => <div style={{ background: "rgba(255,255,255,.06)", height, borderRadius: 2, overflow: "hidden", width: "100%" }}>
  <div style={{ width: `${Math.min(100, value)}%`, height: "100%", background: color, borderRadius: 2, transition: "width .5s cubic-bezier(.16,1,.3,1)" }} />
</div>;

const StatCard = ({ label, value, sub, color = T.tx, icon, trend, style = {} }) => <div style={{ background: T.c2, border: `1px solid ${T.ln}`, borderRadius: T.r12, padding: "1.1rem 1.25rem", ...style }}>
  <div style={{ display: "flex", justifySpaceBetween: "space-between", justifyContent: "space-between", alignItems: "flex-start" }}>
    <div>
      <SectionLabel>{label}</SectionLabel>
      <p style={{ fontSize: 24, fontWeight: 800, color, margin: "2px 0 0", letterSpacing: "-0.03em" }}>{value}</p>
      {sub && <p style={{ fontSize: 11, color: T.t3, margin: "3px 0 0" }}>{sub}</p>}
    </div>
    {icon && <div style={{ width: 36, height: 36, borderRadius: T.r8, background: "rgba(255,255,255,.03)", border: `1px solid ${T.ln}`, display: "flex", alignItems: "center", justifyCenter: "center", justifyContent: "center" }}>
      <i className={`ti ${icon}`} style={{ fontSize: 16, color: T.t2 }} />
    </div>}
  </div>
</div>;

function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState("login");
  const [form, setForm] = useState({ email: "", password: "", name: "", studio: "" });
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const up = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

  const handle = async () => {
    setErr(""); setLoading(true);
    await new Promise(r => setTimeout(r, 600));
    const users = getUsers();
    if (mode === "login") {
      const user = users[form.email.toLowerCase()];
      if (!user) { setErr("No account found with that email."); setLoading(false); return; }
      if (user.password !== form.password) { setErr("Incorrect password."); setLoading(false); return; }
      onAuth({ ...user, email: form.email.toLowerCase() });
    } else {
      if (!form.email || !form.password || !form.name) { setErr("Please fill in all fields."); setLoading(false); return; }
      if (form.password.length < 6) { setErr("Password must be at least 6 characters."); setLoading(false); return; }
      const key = form.email.toLowerCase();
      if (users[key]) { setErr("An account already exists with that email."); setLoading(false); return; }
      const uid = `user_${Date.now()}`;
      users[key] = { uid, email: key, password: form.password, name: form.name, studio: form.studio || form.name + " Studio", joined: new Date().toISOString() };
      saveUsers(users);
      const data = defaultUserData(form.name);
      data.profile.studio = form.studio || form.name + " Studio";
      saveUserData(uid, data);
      onAuth({ ...users[key] });
    }
    setLoading(false);
  };

  return <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: T.bg, padding: "2rem" }}>
    <div style={{ width: "100%", maxWidth: 400 }}>
      <div style={{ textAlign: "center", marginBottom: "2.5rem" }} className="fade">
        <div style={{ display: "inline-flex", alignItems: "center", gap: 8, marginBottom: "1rem" }}>
          <div style={{ width: 32, height: 32, borderRadius: T.r8, background: T.ac, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <i className="ti ti-cut" style={{ fontSize: 16, color: "#fff" }} />
          </div>
          <span style={{ fontSize: 18, fontWeight: 800, letterSpacing: "-0.02em", color: "#fff" }}>EditDesk <span style={{ color: T.ac }}>Ultra</span></span>
        </div>
        <p style={{ fontSize: 13, color: T.t3, margin: 0 }}>The professional OS for video editors</p>
      </div>

      <div style={{ background: T.c1, border: `1px solid ${T.ln2}`, borderRadius: T.r20, padding: "2rem" }} className="fade2">
        <div style={{ display: "flex", background: T.c3, borderRadius: T.r8, padding: 3, marginBottom: "1.5rem" }}>
          {["login", "signup"].map(m => <button key={m} onClick={() => { setMode(m); setErr("") }} style={{ flex: 1, padding: "7px", borderRadius: T.r6, background: mode === m ? T.c1 : "transparent", color: mode === m ? T.tx : T.t3, fontSize: 12, fontWeight: mode === m ? 600 : 400, transition: "all .2s" }}>
            {m === "login" ? "Sign In" : "Create Account"}
          </button>)}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {mode === "signup" && <>
            <div><SectionLabel>Full Name</SectionLabel><Input placeholder="Your name" value={form.name} onChange={up("name")} /></div>
            <div><SectionLabel>Studio Name</SectionLabel><Input placeholder="e.g. RiverCut Studio" value={form.studio} onChange={up("studio")} /></div>
          </>}
          <div><SectionLabel>Email</SectionLabel><Input type="email" placeholder="you@studio.com" value={form.email} onChange={up("email")} /></div>
          <div><SectionLabel>Password</SectionLabel><Input type="password" placeholder="••••••••" value={form.password} onChange={up("password")} onKeyDown={e => e.key === "Enter" && handle()} /></div>
        </div>

        {err && <div style={{ marginTop: 12, padding: "9px 12px", borderRadius: T.r8, background: T.rel, border: `1px solid rgba(239,68,68,.2)`, fontSize: 12, color: T.re }}><i className="ti ti-alert-circle" style={{ marginRight: 5 }} />{err}</div>}

        <Btn v="primary" sz="lg" style={{ width: "100%", justifyContent: "center", marginTop: 16 }} onClick={handle} loading={loading}>
          {mode === "login" ? "Sign In to Workspace" : "Create My Studio →"}
        </Btn>
      </div>
    </div>
  </div>
}

const NAV = [
  { id: "home", icon: "ti-layout-dashboard", label: "Dashboard" },
  { id: "clients", icon: "ti-users", label: "Clients" },
  { id: "projects", icon: "ti-layout-kanban", label: "Projects" },
  { id: "finance", icon: "ti-receipt", label: "Finances" },
  { id: "timer", icon: "ti-clock", label: "Tracker" },
  { id: "delivery", icon: "ti-package", label: "Delivery" },
  { id: "templates", icon: "ti-template", label: "Templates" }
];

function Sidebar({ page, setPage, user, data, onLogout }) {
  const paid = data.earnings?.filter(e => e.status === "Paid").reduce((s, e) => s + e.amount, 0) || 0;
  const active = data.projects?.filter(p => p.status !== "Completed").length || 0;
  return <div style={{ width: 220, minWidth: 220, background: T.c1, borderRight: `1px solid ${T.ln}`, display: "flex", flexDirection: "column", height: "100vh", position: "sticky", top: 0 }}>
    <div style={{ padding: "1.25rem 1rem", borderBottom: `1px solid ${T.ln}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <div style={{ width: 28, height: 28, borderRadius: T.r6, background: T.ac, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <i className="ti ti-cut" style={{ fontSize: 13, color: "#fff" }} />
        </div>
        <div>
          <p style={{ fontSize: 12, fontWeight: 800, color: "#fff", margin: 0 }}>EditDesk</p>
          <p style={{ fontSize: 9, color: T.ac, margin: 0, fontWeight: 600, letterSpacing: ".05em", textTransform: "uppercase" }}>Ultra Pro</p>
        </div>
      </div>
    </div>

    <div style={{ padding: "1rem", borderBottom: `1px solid ${T.ln}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Avatar label={data.profile?.avatar || user.name} color={T.ac} size={32} />
        <div style={{ overflow: "hidden" }}>
          <p style={{ fontSize: 12, fontWeight: 600, color: T.tx, margin: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{data.profile?.name || user.name}</p>
          <p style={{ fontSize: 10, color: T.t3, margin: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{data.profile?.studio}</p>
        </div>
      </div>
    </div>

    <nav style={{ flex: 1, overflowY: "auto", padding: "0.5rem" }}>
      {NAV.map(n => {
        const a = page === n.id;
        return <button key={n.id} onClick={() => setPage(n.id)}
          style={{ display: "flex", alignItems: "center", gap: 9, width: "100%", padding: "8px 10px", borderRadius: T.r8, background: a ? T.acl2 : "transparent", color: a ? "#fff" : T.t2, border: a ? `1px solid ${T.acl}` : "1px solid transparent", fontSize: 12, fontWeight: a ? 600 : 400, transition: "all .15s", marginBottom: 1, textAlign: "left" }}>
          <i className={`ti ${n.icon}`} style={{ fontSize: 14, color: a ? T.ac : T.t3, flexShrink: 0 }} />
          {n.label}
          {n.id === "projects" && active > 0 && <span style={{ marginLeft: "auto", background: T.ac, color: "#fff", fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 3 }}>{active}</span>}
        </button>
      })}
    </nav>

    <div style={{ padding: "0.75rem", borderTop: `1px solid ${T.ln}` }}>
      <button onClick={onLogout} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "7px 10px", borderRadius: T.r8, color: T.t3, fontSize: 12, transition: "all .15s" }}
        onMouseEnter={e => { e.currentTarget.style.color = T.re }} onMouseLeave={e => { e.currentTarget.style.color = T.t3 }}>
        <i className="ti ti-logout" style={{ fontSize: 14 }} /> Sign Out
      </button>
    </div>
  </div>
}

function Dashboard({ data, setPage }) {
  const paidEarnings = data.earnings.filter(e => e.status === "Paid").reduce((s, e) => s + e.amount, 0);
  const pendingEarnings = data.earnings.filter(e => e.status === "Pending").reduce((s, e) => s + e.amount, 0);
  const totalExpenses = data.expenses.reduce((s, e) => s + e.amount, 0);
  const netProfit = paidEarnings - totalExpenses;
  const activeProjects = data.projects.filter(p => p.status !== "Completed");
  const totalLoggedSec = data.logs.reduce((s, l) => s + l.duration, 0);
  const goal = data.goals || { monthlyRevenue: 5000 };
  const revenueProgress = Math.min(100, (paidEarnings / goal.monthlyRevenue) * 100);

  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <div className="fade">
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12 }}>
        <StatCard label="Total Revenue" value={`$${paidEarnings.toLocaleString()}`} sub="All time collected" color={T.gr} icon="ti-cash" />
        <StatCard label="Pending" value={`$${pendingEarnings.toLocaleString()}`} sub="Awaiting payment" color={T.ye} icon="ti-clock-pause" />
        <StatCard label="Net Profit" value={`$${netProfit.toLocaleString()}`} sub="After expenses" color={netProfit >= 0 ? T.gr : T.re} icon="ti-trending-up" />
        <StatCard label="Hours Logged" value={`${Math.floor(totalLoggedSec / 3600)}h`} sub={`${data.logs.length} sessions`} color={T.bl} icon="ti-clock" />
      </div>
    </div>

    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 14 }} className="fade2">
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "1rem" }}>
          <div>
            <SectionLabel>Active Production Pipeline</SectionLabel>
            <p style={{ margin: 0, fontSize: 13, color: T.t2 }}>{activeProjects.length} projects in flight</p>
          </div>
          <Btn v="ghost" sz="sm" onClick={() => setPage("projects")}><i className="ti ti-arrow-right" style={{ fontSize: 12 }} />View All</Btn>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {activeProjects.map(p => (
            <div key={p.id} style={{ background: T.c2, border: `1px solid ${T.ln}`, borderRadius: T.r8, padding: "10px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>{p.title}</span>
                  <Badge color={p.status === "Review" ? "yellow" : p.priority === "High" ? "ac" : "blue"}>{p.status}</Badge>
                </div>
                <span style={{ fontSize: 12, fontWeight: 700, color: T.gr }}>${p.value.toLocaleString()}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <ProgressBar value={p.editProgress || 0} color={p.status === "Review" ? T.ye : T.ac} />
                <span style={{ fontSize: 10, color: T.t3, minWidth: 28 }}>{p.editProgress || 0}%</span>
              </div>
            </div>
          ))}
        </div>
      </Card>

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Card>
          <SectionLabel>Monthly Goal</SectionLabel>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", margin: "4px 0 8px" }}>
            <span style={{ fontSize: 18, fontWeight: 700, color: T.gr }}>${paidEarnings.toLocaleString()}</span>
            <span style={{ fontSize: 11, color: T.t4 }}>/ ${goal.monthlyRevenue.toLocaleString()}</span>
          </div>
          <ProgressBar value={revenueProgress} color={T.gr} height={6} />
          <p style={{ margin: "6px 0 0", fontSize: 11, color: T.t3 }}>{revenueProgress.toFixed(0)}% reached</p>
        </Card>

        <Card>
          <SectionLabel>Quick Operations</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
            <Btn v="primary" style={{ justifyContent: "center", width: "100%" }} onClick={() => setPage("timer")}><i className="ti ti-clock" />Launch Tracker</Btn>
            <Btn v="ghost" style={{ justifyContent: "center", width: "100%" }} onClick={() => setPage("delivery")}><i className="ti ti-package" />Dispatch Assets</Btn>
          </div>
        </Card>
      </div>
    </div>
  </div>
}

function Tracker({ data, setData }) {
  const [running, setRunning] = useState(false);
  const [sec, setSec] = useState(0);
  const tRef = useRef(null);

  useEffect(() => {
    if (running) {
      tRef.current = setInterval(() => setSec(s => s + 1), 1000);
    } else {
      clearInterval(tRef.current);
    }
    return () => clearInterval(tRef.current);
  }, [running]);

  const format = (s) => {
    const h = Math.floor(s / 3600).toString().padStart(2, '0');
    const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
    const sc = (s % 60).toString().padStart(2, '0');
    return `${h}:${m}:${sc}`;
  };

  return <div style={{ maxWidth: 460, margin: "0 auto", textAlign: "center" }}>
    <Card style={{ padding: "2.5rem 1.5rem" }}>
      <SectionLabel>Production Engine Session</SectionLabel>
      <h1 style={{ fontSize: 48, fontFamily: "monospace", fontWeight: 800, margin: "12px 0 24px", color: running ? T.ac : "#fff", letterSpacing: "2px" }}>{format(sec)}</h1>
      <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
        <Btn v={running ? "danger" : "primary"} sz="lg" onClick={() => setRunning(!running)}>
          <i className={running ? "ti ti-player-pause" : "ti ti-player-play"} />
          {running ? "Halt Chrono" : "Engage Chrono"}
        </Btn>
        <Btn v="ghost" sz="lg" onClick={() => { setRunning(false); setSec(0); }} disabled={sec === 0}>Flush</Btn>
      </div>
    </Card>
  </div>
}

function Workspace() {
  const [user, setUser] = useState(null);
  const [data, setData] = useState(null);
  const [page, setPage] = useState("home");

  useEffect(() => {
    const active = localStorage.getItem("editdesk_active_uid");
    if (active) {
      const users = getUsers();
      const matched = Object.values(users).find(u => u.uid === active);
      if (matched) {
        setUser(matched);
        setData(getUserData(active) || defaultUserData(matched.name));
      }
    }
  }, []);

  const handleAuth = (u) => {
    localStorage.setItem("editdesk_active_uid", u.uid);
    setUser(u);
    setData(getUserData(u.uid) || defaultUserData(u.name));
  };

  const handleLogout = () => {
    if (user) saveUserData(user.uid, data);
    localStorage.removeItem("editdesk_active_uid");
    setUser(null);
    setData(null);
  };

  const syncData = (updater) => {
    setData(prev => {
      const updated = typeof updater === 'function' ? updater(prev) : updater;
      if (user) saveUserData(user.uid, updated);
      return updated;
    });
  };

  if (!user || !data) return <AuthScreen onAuth={handleAuth} />;

  return <div style={{ display: "flex", width: "100%", minHeight: "100vh", background: T.bg }}>
    <Sidebar page={page} setPage={setPage} user={user} data={data} onLogout={handleLogout} />
    <main style={{ flex: 1, padding: "1.75rem 2.25rem", overflowX: "hidden" }}>
      {page === "home" && <Dashboard data={data} setPage={setPage} />}
      {page === "clients" && <Clients data={data} setData={syncData} />}
      {page === "projects" && <Projects data={data} setData={syncData} />}
      {page === "finance" && <Finances data={data} setData={syncData} />}
      {page === "timer" && <Tracker data={data} setData={syncData} />}
      {page === "delivery" && <Delivery data={data} setData={syncData} />}
      {page === "templates" && <Templates data={data} setData={syncData} />}
    </main>
  </div>
}

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<Workspace />);
</script>
