<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditDesk Personal Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin: 0; background: #0a0a0c;">
    <div id="root"></div>

    <script type="text/babel">
        // Initialize React Hooks for the browser
        const { useState, useRef, useEffect } = React;

        // ── TOKENS & DATA
        const T = { 
            bg: "#0a0a0c", c1: "#111115", c2: "#18181d", c3: "#1f1f25", c4: "#27272e", c5: "#303038", 
            ln: "rgba(255,255,255,0.06)", tx: "#f0f0f4", t2: "#a0a0b0", ac: "#d95f45", gr: "#30d17a", 
            bl: "#4a9df0", pu: "#9d78e8", re: "#e05050", ff: "sans-serif", rM: "13px" 
        };

        const SEED_PROJECTS = [
            { id:1, client:"Alex Rivera", title:"Episode 47 — Tech Talk", status:"In Progress", value:850 },
            { id:2, client:"Jake Torres", title:"Documentary — Act II", status:"Review", value:1800 },
            { id:3, client:"Zoe Chen", title:"May Lifestyle Reel", status:"In Progress", value:600 }
        ];

        // ── MAIN COMPONENT
        function EditDesk() {
            return (
                <div style={{ 
                    fontFamily: T.ff, 
                    color: T.tx, 
                    backgroundColor: T.bg, 
                    minHeight: '100vh', 
                    padding: '40px' 
                }}>
                    <div style={{ maxWidth: '900px', margin: '0 auto' }}>
                        <header style={{ marginBottom: '40px', borderBottom: `1px solid ${T.ln}`, paddingBottom: '20px' }}>
                            <h1 style={{ fontSize: '28px', fontWeight: 'bold', color: T.ac }}>My EditDesk</h1>
                            <p style={{ color: T.t2 }}>Personal Production Hub</p>
                        </header>

                        <div style={{ display: 'grid', gap: '20px' }}>
                            <h2 style={{ fontSize: '18px', fontWeight: '600' }}>Active Projects</h2>
                            {SEED_PROJECTS.map(p => (
                                <div key={p.id} style={{ 
                                    background: T.c2, 
                                    padding: '20px', 
                                    borderRadius: T.rM, 
                                    border: `1px solid ${T.ln}`,
                                    display: 'flex',
                                    justifyContent: 'space-between',
                                    alignItems: 'center'
                                }}>
                                    <div>
                                        <div style={{ fontWeight: '600' }}>{p.title}</div>
                                        <div style={{ fontSize: '13px', color: T.t2 }}>{p.client}</div>
                                    </div>
                                    <div style={{ textAlign: 'right' }}>
                                        <div style={{ color: T.gr, fontWeight: 'bold' }}>${p.value}</div>
                                        <div style={{ fontSize: '11px', opacity: 0.7 }}>{p.status}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <footer style={{ marginTop: '50px', color: T.t2, fontSize: '12px', textAlign: 'center' }}>
                            Ready to edit. Connected via Netlify.
                        </footer>
                    </div>
                </div>
            );
        }

        // ── RENDER ENGINE
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EditDesk />);
    </script>
</body>
</html>
