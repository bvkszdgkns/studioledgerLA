<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vanguard CRM">
  
  <title>Vanguard Studio Engine</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --text-tertiary: #48484A;
      --accent: #D4AF37; 
      --accent-rgb: 212, 175, 55;
      --apple-blue: #0A84FF;
      --apple-green: #30D158;
      --apple-red: #FF453A;
      --apple-orange: #FF9F0A;
      --blur: blur(20px);
    }

    .light-mode {
      --bg: #F2F2F7;
      --card-bg: rgba(255, 255, 255, 0.8);
      --card-border: rgba(0, 0, 0, 0.05);
      --text: #000000;
      --text-secondary: #636366;
      --text-tertiary: #C7C7CC;
      --accent: #A5782A;
      --accent-rgb: 165, 120, 42;
      --apple-blue: #007AFF;
      --apple-green: #34C759;
      --apple-red: #FF3B30;
      --apple-orange: #FF9500;
    }

    html, body, #root { 
      height: 100%; 
      width: 100%; 
      background-color: var(--bg); 
      color: var(--text); 
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* iOS App Layout Structure */
    .app-viewport {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .sidebar {
      width: 280px;
      background: rgba(18, 18, 18, 0.6);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .main-window {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      padding-top: calc(2rem + env(safe-area-inset-top));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    }

    /* iPhone/Mobile Adaptability Layer */
    @media (max-width: 768px) {
      .app-viewport {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 75px;
        flex-direction: row;
        border-right: none;
        border-top: 1px solid var(--card-border);
        padding: 0 12px;
        padding-bottom: env(safe-area-inset-bottom);
        justify-content: space-around;
        align-items: center;
        z-index: 999;
      }
      .sidebar-brand, .sidebar-footer {
        display: none !important;
      }
      .navigation-menu {
        flex-direction: row !important;
        width: 100%;
        justify-content: space-around;
        gap: 0 !important;
      }
      .nav-item {
        flex-direction: column !important;
        align-items: center !important;
        gap: 4px !important;
        font-size: 10px !important;
        padding: 6px 0 !important;
        width: 50px;
      }
      .nav-item i {
        font-size: 20px !important;
      }
      .main-window {
        padding: 1.25rem;
        padding-top: calc(1.5rem + env(safe-area-inset-top));
      }
    }

    /* Apple Premium UI Styling Components */
    .apple-card {
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
    }

    .apple-input {
      background: rgba(120, 120, 128, 0.12);
      border: none;
      color: var(--text);
      font-size: 16px; /* Prevents auto-zoom on iOS safari */
      padding: 12px 16px;
      border-radius: 10px;
      width: 100%;
      outline: none;
      transition: background 0.2s ease;
    }
    .apple-input:focus {
      background: rgba(120, 120, 128, 0.2);
    }

    .apple-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .apple-btn:active {
      opacity: 0.7;
    }

    .accent-glow {
      text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4);
    }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// --- SUPABASE CONFIGURATION MATRIX ---
// Replace these parameters with your real Supabase dashboard endpoints to activate persistent back-ends
const SUPABASE_URL = "https://your-project-id.supabase.co";
const SUPABASE_ANON_KEY = "your-anon-public-key";
const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function App() {
  const [activeTab, setActiveTab] = useState("dashboard");
  const [isLightMode, setIsLightMode] = useState(false);
  const [supabaseConnected, setSupabaseConnected] = useState(false);

  // Structural mock data structures designed to mirror table frames in Supabase
  const [clients, setClients] = useState([
    { id: 1, corporate_name: "Aether Cinema Corp", primary_contact: "Alex Vance", tracking_status: "Active Pipeline" },
    { id: 2, corporate_name: "Kaufman Luxury Group", primary_contact: "Elena Rostova", tracking_status: "Active Pipeline" }
  ]);

  const [projects, setProjects] = useState([
    { id: 1, title: "The Sovereign Identity — Master Cut", client: "Aether Cinema Corp", pipeline_stage: "Color Grading Suite", valuation: 8400, render_progress: 45 },
    { id: 2, title: "Excellence Heritage Campaign 60s", client: "Kaufman Luxury Group", pipeline_stage: "Rough Assembly Pass", valuation: 4500, render_progress: 90 }
  ]);

  const [dispatches, setDispatches] = useState([
    { id: 1, asset_title: "Heritage Promo V3 Super High", destination_url: "https://vanguard.frame.io/kaufman-60s", tracking_status: "Awaiting Client Review" }
  ]);

  const [financials, setFinancials] = useState({
    settled_yield: 12900,
    escrow_pipeline: 8400,
    overhead_burn: 149.99
  });

  useEffect(() => {
    if (supabase && SUPABASE_URL !== "https://your-project-id.supabase.co") {
      setSupabaseConnected(true);
      // Real-time synchronization hooks from Supabase tables can be pulled safely here
    }
  }, []);

  const toggleAppearanceFramework = () => {
    setIsLightMode(!isLightMode);
    document.body.classList.toggle("light-mode");
  };

  return (
    <div className="app-viewport">
      
      {/* Navigation Ecosystem (Responsive iOS Drawer Bar / Bottom Dock) */}
      <div className="sidebar">
        <div style={{ width: "100%" }}>
          <div className="sidebar-brand" style={{ padding: "24px 20px", display: "flex", alignItems: "center", gap: "10px" }}>
            <div style={{ width: 30, height: 30, borderRadius: "7px", background: "var(--accent)", display: "flex", alignItems: "center", justifycontent: "center" }}>
              <i className="ti ti-video" style={{ color: "#000", fontSize: 16 }} />
            </div>
            <span style={{ fontSize: 15, fontWeight: 700, letterSpacing: "-0.02em" }}>VANGUARD</span>
          </div>

          <div className="navigation-menu" style={{ display: "flex", flexDirection: "column", gap: "4px", padding: "0 12px" }}>
            {[
              { id: "dashboard", icon: "ti-square-dashboard", label: "Studio" },
              { id: "clients", icon: "ti-building-skyscraper", label: "Clients" },
              { id: "projects", icon: "ti-timeline-event", label: "Pipelines" },
              { id: "dispatches", icon: "ti-transform", label: "Dispatches" },
              { id: "finances", icon: "ti-database-dollar", label: "Ledger" }
            ].map(item => {
              const active = activeTab === item.id;
              return (
                <div 
                  key={item.id} 
                  className="nav-item"
                  onClick={() => setActiveTab(item.id)}
                  style={{
                    display: "flex", alignItems: "center", gap: "12px", padding: "12px 14px", borderRadius: "10px",
                    background: active ? "rgba(255,255,255,0.08)" : "transparent",
                    color: active ? "var(--text)" : "var(--text-secondary)", cursor: "pointer"
                  }}
                >
                  <i className={`ti ${item.icon}`} style={{ fontSize: 18, color: active ? "var(--accent)" : "var(--text-secondary)" }} />
                  <span style={{ fontSize: 13, fontWeight: active ? 600 : 500 }}>{item.label}</span>
                </div>
              );
            })}
          </div>
        </div>

        <div className="sidebar-footer" style={{ padding: "20px", display: "flex", flexDirection: "column", gap: "10px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: 11, color: "var(--text-secondary)" }}>
            <div style={{ width: 6, height: 6, borderRadius: "50%", background: supabaseConnected ? "var(--apple-green)" : "var(--apple-orange)" }} />
            <span>{supabaseConnected ? "Supabase Core Linked" : "Local Prototype Array Engine"}</span>
          </div>
          <div onClick={toggleAppearanceFramework} style={{ cursor: "pointer", fontSize: 12, color: "var(--text-secondary)", display: "flex", alignItems: "center", gap: "6px" }}>
            <i className={isLightMode ? "ti ti-moon" : "ti ti-sun"} />
            <span>Toggle Architecture Profile</span>
          </div>
        </div>
      </div>

      {/* Primary Display Windows Space */}
      <div className="main-window">
        {activeTab === "dashboard" && (
          <div>
            <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.04em", marginBottom: "4px" }}>Studio Overview</h1>
            <p style={{ color: "var(--text-secondary)", fontSize: 14, marginBottom: "24px" }}>System operational matrix metrics</p>
            
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: "12px", marginBottom: "16px" }}>
              <div className="apple-card">
                <span style={{ fontSize: 11, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase" }}>Settled Yield</span>
                <p style={{ fontSize: 22, fontWeight: 700, color: "var(--accent)", marginTop: "6px" }} className="accent-glow">${financials.settled_yield.toLocaleString()}</p>
              </div>
              <div className="apple-card">
                <span style={{ fontSize: 11, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase" }}>Escrow Pipeline</span>
                <p style={{ fontSize: 22, fontWeight: 700, color: "var(--apple-orange)", marginTop: "6px" }}>${financials.escrow_pipeline.toLocaleString()}</p>
              </div>
            </div>

            <div className="apple-card">
              <h3 style={{ fontSize: 15, fontWeight: 600, marginBottom: "12px" }}>Active Live Production Channels</h3>
              {projects.map(p => (
                <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid var(--card-border)" }}>
                  <div>
                    <p style={{ fontSize: 13, fontWeight: 600 }}>{p.title}</p>
                    <p style={{ fontSize: 11, color: "var(--text-secondary)" }}>{p.client}</p>
                  </div>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "var(--accent)" }}>{p.render_progress}%</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {activeTab === "clients" && (
          <div>
            <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.04em", marginBottom: "16px" }}>Clients Index</h1>
            <div className="apple-card" style={{ display: "flex", flexDirection: "column", gap: "12px", marginBottom: "16px" }}>
              <input className="apple-input" placeholder="Corporate Entity Identifier Name" />
              <input className="apple-input" placeholder="Primary Contact Management Link Address" />
              <button className="apple-btn" style={{ background: "var(--accent)", color: "#000" }}>Provision Client Profile Row</button>
            </div>
            {clients.map(c => (
              <div key={c.id} className="apple-card" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <h3 style={{ fontSize: 16, fontWeight: 600 }}>{c.corporate_name}</h3>
                  <p style={{ fontSize: 12, color: "var(--text-secondary)" }}>Secure Token Signature Line: {c.primary_contact}</p>
                </div>
                <span style={{ fontSize: 11, fontWeight: 600, color: "var(--apple-blue)", background: "rgba(10,132,255,0.1)", padding: "4px 8px", borderRadius: "6px" }}>{c.tracking_status}</span>
              </div>
            ))}
          </div>
        )}

        {activeTab === "projects" && (
          <div>
            <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.04em", marginBottom: "16px" }}>Production Pipelines</h1>
            {projects.map(p => (
              <div key={p.id} className="apple-card">
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "12px" }}>
                  <div>
                    <h3 style={{ fontSize: 16, fontWeight: 600 }}>{p.title}</h3>
                    <p style={{ fontSize: 12, color: "var(--text-secondary)" }}>Firm Anchor Identity: {p.client}</p>
                  </div>
                  <span style={{ fontSize: 14, fontWeight: 700, color: "var(--accent)" }}>${p.valuation.toLocaleString()}</span>
                </div>
                <div style={{ background: "rgba(255,255,255,0.05)", height: "6px", borderRadius: "3px", overflow: "hidden", marginBottom: "8px" }}>
                  <div style={{ width: `${p.render_progress}%`, background: "var(--accent)", height: "100%" }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-secondary)" }}>
                  <span>Status: {p.pipeline_stage}</span>
                  <span>Rendering Configuration Array: {p.render_progress}%</span>
                </div>
              </div>
            ))}
          </div>
        )}

        {activeTab === "dispatches" && (
          <div>
            <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.04em", marginBottom: "16px" }}>Dispatches Cloud</h1>
            {dispatches.map(d => (
              <div key={d.id} className="apple-card">
                <h3 style={{ fontSize: 15, fontWeight: 600, marginBottom: "4px" }}>{d.asset_title}</h3>
                <p style={{ fontSize: 12, color: "var(--apple-blue)", marginBottom: "12px", wordBreak: "break-all" }}>{d.destination_url}</p>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: "var(--apple-orange)" }}>{d.tracking_status}</span>
                  <button className="apple-btn" style={{ padding: "6px 12px", fontSize: 12 }} onClick={() => window.open(d.destination_url, '_blank')}>Launch Dispatch Link Mirror</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {activeTab === "finances" && (
          <div>
            <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.04em", marginBottom: "16px" }}>Asset Ledger Matrix</h1>
            <div className="apple-card" style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", borderBottom: "1px solid var(--card-border)", paddingBottom: "12px" }}>
                <span style={{ color: "var(--text-secondary)" }}>Settled Liquidity Yield</span>
                <span style={{ fontWeight: 700, color: "var(--apple-green)" }}>+${financials.settled_yield.toLocaleString()}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", borderBottom: "1px solid var(--card-border)", paddingBottom: "12px" }}>
                <span style={{ color: "var(--text-secondary)" }}>Escrow Pipeline Reserve Valuation</span>
                <span style={{ fontWeight: 700, color: "var(--apple-orange)" }}>+${financials.escrow_pipeline.toLocaleString()}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ color: "var(--text-secondary)" }}>Infrastructure Overhead Engine Operational Cost</span>
                <span style={{ fontWeight: 700, color: "var(--apple-red)" }}>-${financials.overhead_burn.toLocaleString()}</span>
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>

</body>
</html>
