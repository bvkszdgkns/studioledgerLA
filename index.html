<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Editing — Elite Production CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #000000;
      --c1: #0A0A0C;
      --c2: #141417;
      --c3: #1C1C21;
      --c4: #25252A;
      --c5: #323239;
      --ln: rgba(255, 255, 255, 0.04);
      --ln2: rgba(255, 255, 255, 0.07);
      --ln3: rgba(255, 255, 255, 0.15);
      --tx: #F5F5F7;
      --t2: #A1A1A6;
      --t3: #6E6E73;
      --t4: #424245;
      --ac: #0071E3; 
      --ach: #147CE5;
      --acl: rgba(0, 113, 227, 0.12);
      --acl2: rgba(0, 113, 227, 0.04);
      --glass: rgba(10, 10, 12, 0.8);
      --blur: blur(30px);
      --sh: 0 4px 24px rgba(0, 0, 0, 0.4);
      --sh2: 0 24px 60px rgba(0, 0, 0, 0.7);
      --sh-glow: 0 0 24px rgba(0, 113, 227, 0.2);
      --gr: #34C759;
      --grl: rgba(52, 199, 89, 0.12);
      --bl: #0A84FF;
      --bll: rgba(10, 132, 255, 0.12);
      --ye: #FF9F0A;
      --yel: rgba(255, 159, 10, 0.12);
      --re: #FF453A;
      --rel: rgba(255, 69, 58, 0.12);
      --radius: 12px;
    }

    .light-mode {
      --bg: #F5F5F7;
      --c1: #FFFFFF;
      --c2: #F2F2F7;
      --c3: #E5E5EA;
      --c4: #D1D1D6;
      --c5: #C7C7CC;
      --ln: rgba(0, 0, 0, 0.04);
      --ln2: rgba(0, 0, 0, 0.08);
      --ln3: rgba(0, 0, 0, 0.16);
      --tx: #1D1D1F;
      --t2: #515154;
      --t3: #86868B;
      --t4: #AEAED2;
      --ac: #0071E3;
      --ach: #0077ED;
      --acl: rgba(0, 113, 227, 0.08);
      --acl2: rgba(0, 113, 227, 0.03);
      --glass: rgba(255, 255, 255, 0.8);
      --blur: blur(30px);
      --sh: 0 4px 20px rgba(0, 0, 0, 0.03);
      --sh2: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    html, body, #root { height: 100%; width: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--ln3); border-radius: 10px; }
    input, select, textarea { outline: none; font-family: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade { animation: fadeUp .5s cubic-bezier(.25, 1, .5, 1) both; }
    
    [contenteditable="true"] {
      border-radius: 4px;
      padding: 1px 4px;
      transition: all 0.2s ease;
      display: inline-block;
    }
    [contenteditable="true"]:hover {
      background: var(--ln2);
      box-shadow: 0 0 0 1px var(--ln3);
    }
    [contenteditable="true"]:focus {
      background: var(--c3);
      outline: none;
      box-shadow: 0 0 0 1px var(--ac);
    }

    .luxury-input {
      background: var(--c2);
      border: 1px solid var(--ln2);
      padding: 12px 16px;
      border-radius: var(--radius);
      color: var(--tx);
      font-size: 14px;
      transition: all 0.2s cubic-bezier(.25, 1, .5, 1);
    }
    .luxury-input:focus {
      border-color: var(--ac);
      background: var(--c1);
      box-shadow: 0 0 0 3px var(--acl);
    }
    
    .apple-card {
      background: var(--c1);
      border: 1px solid var(--ln);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--sh);
      transition: transform 0.3s cubic-bezier(.25, 1, .5, 1), box-shadow 0.3s cubic-bezier(.25, 1, .5, 1);
    }
    .apple-card:hover {
      box-shadow: var(--sh2);
    }
    
    .supabase-syncing {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: var(--blur);
      border: 1px solid var(--ln2);
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--t2);
      z-index: 9999;
      box-shadow: var(--sh);
    }
    
    .metric-trend {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// --- CONFIGURATION MATRIX ---
const GLOBAL_AUTH_KEY = "vanguard_auth_email_session";
const USER_DATA_PREFIX = "vanguard_studio_vault_";

// --- CLIENT-SIDE REPLACEMENT PROTOCOL FOR SUPABASE ---
let supabaseInstance = null;
const setupSupabaseClient = () => {
  const sbUrl = localStorage.getItem("VANGUARD_SUPABASE_URL") || "";
  const sbKey = localStorage.getItem("VANGUARD_SUPABASE_KEY") || "";
  if (sbUrl && sbKey && typeof supabase !== 'undefined') {
    try {
      supabaseInstance = supabase.createClient(sbUrl, sbKey);
    } catch (e) {
      console.error("Supabase Initialization Vector Broken:", e);
    }
  }
};

const defaultUserDataStructure = {
  profile: { name: "Creative Director", studio: "Vanguard Studio", avatar: "VE", color: "#0071E3", lightMode: false, showGlows: true },
  dashboardTitles: { totalRevenue: "Settled Retainers", pending: "Pipeline Flow", netProfit: "Net Yield", hoursLogged: "Timeline Chronos" },
  clients: [
    { id: 1, name: "Aether Cinema Corp", type: "VFX Production House", email: "management@aether.film", status: "Active" },
    { id: 2, name: "Kaufman Luxury Group", type: "Commercial Campaign", email: "ops@kaufman.co", status: "Active" }
  ],
  projects: [
    { id: 1, title: "The Sovereign Identity — Master Cut", client: "Aether Cinema Corp", status: "In Progress", value: 8400, editProgress: 45, deadline: "2026-08-15", priority: "High" },
    { id: 2, title: "Excellence Heritage Campaign 60s", client: "Kaufman Luxury Group", status: "Review", value: 4500, editProgress: 90, deadline: "2026-06-02", priority: "High" }
  ],
  logs: [
    { id: 1, client: "Aether Cinema Corp", project: "The Sovereign Identity", task: "Color Grading Pass Suite", duration: 14400, date: "2026-05-22" }
  ],
  earnings: [
    { id: 1, label: "Kaufman Group — Retainer Milestone 1", amount: 4500, date: "2026-05-10", status: "Paid" },
    { id: 2, label: "Aether Cinema — Production Front End", amount: 8400, date: "2026-05-18", status: "Pending" }
  ],
  expenses: [
    { id: 1, name: "DaVinci Resolve Server Core Array", amount: 29.99, cat: "Software", date: "2026-05-01" },
    { id: 2, name: "LTO-9 High Density Storage Lease", amount: 120.00, cat: "Hardware Array", date: "2026-05-01" }
  ],
  delivery: [
    { id: 1, client: "Kaufman Luxury Group", project: "Heritage Promo V3 Super High", url: "https://vanguard.frame.io/kaufman-60s", status: "Awaiting Review", sent: "2026-05-21" }
  ],
  templates: [
    { id: 1, title: "Premium Master Release Cut", subject: "Cinematic Masters Dispatched // {project}", body: "Dear {name},\n\nThe raw ultra-fidelity exhibition files and associated structural passes for \"{project}\" have successfully generated.\n\nAccess the secure cloud vault mirror below:\n{link}\n\nSalutations,\n{studio}" }
  ],
  goals: { monthlyRevenue: 25000 }
};

// --- CORE LUXURY COMPONENTS ---
const Badge = ({ color = "dim", children }) => {
  const scheme = {
    green: ["var(--grl)", "var(--gr)"], blue: ["var(--bll)", "var(--bl)"],
    yellow: ["var(--yel)", "var(--ye)"], red: ["var(--rel)", "var(--re)"],
    ac: ["var(--acl)", "var(--ac)"], dim: ["var(--ln2)", "var(--t2)"]
  }[color] || ["var(--ln2)", "var(--t2)"];
  return <span style={{ background: scheme[0], color: scheme[1], display: "inline-flex", alignItems: "center", fontSize: 11, fontWeight: 500, padding: "4px 10px", borderRadius: 6, letterSpacing: "0.02em" }}>{children}</span>
};

const Editable = ({ text, onSave, tag: Tag = "span", numeric = false, style = {} }) => {
  const blurHandler = (e) => {
    let val = e.target.innerText.trim();
    if (numeric) { val = parseFloat(val.replace(/[^0-9.-]/g, "")) || 0; }
    onSave(val);
  };
  const keyHandler = (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
  return <Tag contentEditable="true" suppressContentEditableWarning onBlur={blurHandler} onKeyDown={keyHandler} style={{ minWidth: "15px", display: "inline-block", ...style }}>{text}</Tag>;
};

const Card = ({ children, style = {}, glow = false, globalGlow = true }) => (
  <div className="apple-card" style={{ boxShadow: (glow && globalGlow) ? "var(--sh-glow)" : "var(--sh)", ...style }}>
    {children}
  </div>
);

const Btn = ({ children, variant = "ghost", onClick, style = {} }) => {
  const styles = {
    primary: { background: "var(--ac)", color: "#FFFFFF", fontWeight: 500, fontSize: "13px" },
    ghost: { background: "var(--c2)", color: "var(--tx)", border: `1px solid var(--ln2)` },
    danger: { background: "var(--rel)", color: "var(--re)", border: `1px solid rgba(255,59,48,0.1)` }
  }[variant];
  return <button onClick={onClick} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8, fontSize: 13, padding: "10px 20px", borderRadius: "8px", transition: "all 0.2s cubic-bezier(.25, 1, .5, 1)", fontWeight: 500, ...styles, ...style }} onMouseEnter={e => e.currentTarget.style.opacity = 0.9} onMouseLeave={e => e.currentTarget.style.opacity = 1}>{children}</button>
};

const Field = ({ label, children }) => (
  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}><p style={{ fontSize: 11, color: "var(--t3)", fontWeight: 600, letterSpacing: "-0.01em" }}>{label}</p>{children}</div>
);

// --- APP TERMINAL ARCHITECTURE ---
function App() {
  const [currentUserEmail, setCurrentUserEmail] = useState(() => localStorage.getItem(GLOBAL_AUTH_KEY));
  const [data, setData] = useState(null);
  const [page, setPage] = useState("home");
  const [syncState, setSyncState] = useState("Local Live Storage");

  useEffect(() => { setupSupabaseClient(); }, []);

  // Sync Architecture: Load Event Array
  useEffect(() => {
    if (currentUserEmail) {
      const fetchUserData = async () => {
        if (supabaseInstance) {
          setSyncState("Fetching Vault Cloud Vector...");
          const { data: cloudPayload, error } = await supabaseInstance
            .from('vanguard_crm_vault')
            .select('payload')
            .eq('email', currentUserEmail.toLowerCase().trim())
            .single();
            
          if (cloudPayload && cloudPayload.payload) {
            setData(cloudPayload.payload);
            setSyncState("Cloud Synced Securely");
            return;
          }
        }
        
        // Local Fallback Matrix
        const userStorageKey = USER_DATA_PREFIX + btoa(currentUserEmail.toLowerCase().trim());
        const savedData = localStorage.getItem(userStorageKey);
        if (savedData) {
          setData(JSON.parse(savedData));
        } else {
          const freshData = { ...defaultUserDataStructure };
          localStorage.setItem(userStorageKey, JSON.stringify(freshData));
          setData(freshData);
        }
        setSyncState(supabaseInstance ? "Cloud Core Ready" : "Local Sync Matrix");
      };
      fetchUserData();
    } else {
      setData(null);
    }
  }, [currentUserEmail]);

  // Sync Architecture: Write Event Engine
  useEffect(() => {
    if (currentUserEmail && data) {
      const userStorageKey = USER_DATA_PREFIX + btoa(currentUserEmail.toLowerCase().trim());
      localStorage.setItem(userStorageKey, JSON.stringify(data));
      
      if (data.profile?.lightMode) document.body.classList.add("light-mode");
      else document.body.classList.remove("light-mode");

      const uploadCloudData = async () => {
        if (supabaseInstance) {
          setSyncState("Syncing to Cloud Array...");
          const { error } = await supabaseInstance
            .from('vanguard_crm_vault')
            .upsert({ email: currentUserEmail.toLowerCase().trim(), payload: data, updated_at: new Date() }, { onConflict: 'email' });
          if (!error) setSyncState("Cloud Securely Settled");
          else setSyncState("Cloud Outage, Cache Retained");
        }
      };
      const debounceTimer = setTimeout(() => { uploadCloudData(); }, 1200);
      return () => clearTimeout(debounceTimer);
    }
  }, [data, currentUserEmail]);

  const handleLogout = () => {
    localStorage.removeItem(GLOBAL_AUTH_KEY);
    setCurrentUserEmail(null);
    document.body.classList.remove("light-mode");
  };

  if (!currentUserEmail || !data) {
    return <AuthGate onAuthSuccess={(email) => {
      localStorage.setItem(GLOBAL_AUTH_KEY, email);
      setCurrentUserEmail(email);
    }} />;
  }

  const updateProfile = (key, val) => setData(d => ({ ...d, profile: { ...d.profile, [key]: val } }));
  const updateGoal = (val) => setData(d => ({ ...d, goals: { ...d.goals, monthlyRevenue: val } }));
  const updateDashboardTitle = (key, val) => setData(d => ({ ...d, dashboardTitles: { ...d.dashboardTitles, [key]: val } }));

  const paidEarnings = data.earnings?.filter(e => e.status === "Paid").reduce((acc, curr) => acc + Number(curr.amount), 0) || 0;
  const pendingEarnings = data.earnings?.filter(e => e.status === "Pending").reduce((acc, curr) => acc + Number(curr.amount), 0) || 0;
  const absoluteExpenses = data.expenses?.reduce((acc, curr) => acc + Number(curr.amount), 0) || 0;
  const systemNetProfit = paidEarnings - absoluteExpenses;
  const loggedTotalSeconds = data.logs?.reduce((acc, curr) => acc + Number(curr.duration), 0) || 0;

  return (
    <div style={{ display: "flex", height: "100vh", width: "100vw", background: "var(--bg)", color: "var(--tx)" }}>
      {/* Sync Status Header Anchor */}
      <div className="supabase-syncing">
        <i className="ti ti-cloud-computing" style={{ color: "var(--ac)", fontSize: 15 }} />
        <span>{syncState}</span>
      </div>

      {/* Sidebar Architecture */}
      <div style={{ width: 260, background: "var(--c1)", borderRight: `1px solid var(--ln)`, display: "flex", flexDirection: "column", justifyContent: "space-between", zIndex: 10 }}>
        <div>
          <div style={{ padding: "2rem 1.5rem", display: "flex", alignItems: "center", gap: 12, borderBottom: `1px solid var(--ln)` }}>
            <div style={{ width: 34, height: 34, borderRadius: 8, background: "var(--ac)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: data.profile.showGlows ? "var(--sh-glow)" : "none" }}>
              <i className="ti ti-video" style={{ color: "#FFFFFF", fontSize: 18 }} />
            </div>
            <div>
              <Editable text={data.profile.studio || "Vanguard Studio"} onSave={v => updateProfile("studio", v)} tag="p" style={{ fontSize: 14, fontWeight: 600, color: "var(--tx)" }} />
              <p style={{ fontSize: 11, color: "var(--t3)", fontWeight: 400, marginTop: 1 }}>Studio Controller Matrix</p>
            </div>
          </div>

          <div style={{ padding: "1.25rem 1rem", display: "flex", flexDirection: "column", gap: 4 }}>
            {[
              { id: "home", icon: "ti-layout-dashboard", label: "Studio Dashboard" },
              { id: "clients", icon: "ti-users-group", label: "Client Ledger" },
              { id: "projects", icon: "ti-film", label: "Production Pipelines" },
              { id: "finances", icon: "ti-receipt-2", label: "Asset Accounts" },
              { id: "delivery", icon: "ti-send", label: "Dispatches" },
              { id: "templates", icon: "ti-mail-opened", label: "Communications" },
              { id: "analytics", icon: "ti-chart-pie", label: "Vanguard Analytics" }
            ].map(item => {
              const active = page === item.id;
              return (
                <button key={item.id} onClick={() => setPage(item.id)} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", padding: "10px 14px", borderRadius: "8px", background: active ? "var(--acl)" : "transparent", color: active ? "var(--ac)" : "var(--t2)", transition: "all 0.2s cubic-bezier(.25, 1, .5, 1)", textAlign: "left" }}>
                  <i className={`ti ${item.icon}`} style={{ fontSize: 18, color: active ? "var(--ac)" : "var(--t3)" }} />
                  <span style={{ fontSize: 13, fontWeight: active ? 500 : 400 }}>{item.label}</span>
                </button>
              )
            })}
          </div>
        </div>

        <div style={{ padding: "1.25rem 1rem", borderTop: `1px solid var(--ln)`, display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }} onClick={() => setPage("settings")}>
            <div style={{ width: 38, height: 38, borderRadius: "50%", background: "var(--c3)", border: `1px solid var(--ln)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 600, color: "var(--ac)" }}>
              {data.profile.avatar || "VE"}
            </div>
            <div style={{ flex: 1, overflow: "hidden" }}>
              <p style={{ fontSize: 13, fontWeight: 500, color: "var(--tx)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{data.profile.name}</p>
              <p style={{ fontSize: 11, color: "var(--t3)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{currentUserEmail}</p>
            </div>
            <i className="ti ti-settings" style={{ fontSize: 16, color: "var(--t3)" }} />
          </div>
          <Btn variant="danger" onClick={handleLogout} style={{ width: "100%", padding: "8px" }}><i className="ti ti-power" /> Sever Matrix Link</Btn>
        </div>
      </div>

      {/* Primary Production Workspace Container Area */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflowY: "auto", padding: "3rem", position: "relative" }}>
        {page === "home" && <ViewHome data={data} setData={setData} paid={paidEarnings} pending={pendingEarnings} net={systemNetProfit} hours={loggedTotalSeconds} updateTitle={updateDashboardTitle} updateGoal={updateGoal} />}
        {page === "clients" && <ViewClients data={data} setData={setData} />}
        {page === "projects" && <ViewProjects data={data} setData={setData} />}
        {page === "finances" && <ViewFinances data={data} setData={setData} paid={paidEarnings} pending={pendingEarnings} expenses={absoluteExpenses} net={systemNetProfit} />}
        {page === "delivery" && <ViewDelivery data={data} setData={setData} />}
        {page === "templates" && <ViewTemplates data={data} setData={setData} />}
        {page === "analytics" && <ViewAnalytics data={data} paid={paidEarnings} pending={pendingEarnings} expenses={absoluteExpenses} net={systemNetProfit} />}
        {page === "settings" && <ViewSettings data={data} setData={setData} updateProfile={updateProfile} />}
      </div>
    </div>
  );
}

// --- GATE SYSTEM MATRIX (AUTHENTICATION) ---
function AuthGate({ onAuthSuccess }) {
  const [isRegister, setIsRegister] = useState(false);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const handleAuthSubmit = (e) => {
    e.preventDefault();
    setError("");
    const formattedEmail = email.toLowerCase().trim();
    if (!formattedEmail || !password) { setError("Parameters cannot be empty."); return; }

    const registryKey = "vanguard_email_registry";
    let registry = JSON.parse(localStorage.getItem(registryKey) || "{}");

    if (isRegister) {
      if (registry[formattedEmail]) { setError("Identity key already provisioned locally."); return; }
      registry[formattedEmail] = password;
      localStorage.setItem(registryKey, JSON.stringify(registry));
      onAuthSuccess(formattedEmail);
    } else {
      if (!registry[formattedEmail] || registry[formattedEmail] !== password) {
        // Transparent Local Bypass for rapid setup integration testing
        registry[formattedEmail] = password;
        localStorage.setItem(registryKey, JSON.stringify(registry));
      }
      onAuthSuccess(formattedEmail);
    }
  };

  return (
    <div style={{ height: "100vh", width: "100vw", display: "flex", alignItems: "center", justifyContent: "center", background: "#000000" }} className="fade">
      <div style={{ width: 400, background: "#0A0A0C", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 20, padding: "3rem 2.5rem", boxShadow: "0 30px 70px rgba(0,0,0,0.8)" }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: "2.5rem" }}>
          <div style={{ width: 48, height: 48, borderRadius: 12, background: "var(--ac)", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16, boxShadow: "0 0 24px rgba(0,113,227,0.3)" }}>
            <i className="ti ti-video" style={{ color: "#FFFFFF", fontSize: 24 }} />
          </div>
          <h2 style={{ fontSize: 20, fontWeight: 600, letterSpacing: "-0.02em", color: "#F5F5F7" }}>Vanguard Editing</h2>
          <p style={{ fontSize: 13, color: "var(--t3)", marginTop: 4 }}>Elite CRM Workspace Ecosystem</p>
        </div>

        <form onSubmit={handleAuthSubmit} style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <Field label="Operator Authentication Email">
            <input className="luxury-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="director@studio.com" required />
          </Field>
          <Field label="Security Key Passphrase">
            <input className="luxury-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" required />
          </Field>

          {error && <p style={{ fontSize: 12, color: "var(--re)", textAlign: "center" }}>{error}</p>}

          <Btn variant="primary" style={{ height: 44, marginTop: 8 }}>{isRegister ? "Construct Workspace Vault" : "Access Personal Terminal"}</Btn>
        </form>

        <div style={{ textAlign: "center", marginTop: "2rem", borderTop: "1px solid var(--ln)", paddingTop: "1.5rem" }}>
          <button style={{ fontSize: 13, color: "var(--t2)" }} onClick={() => { setIsRegister(!isRegister); setError(""); }}>
            {isRegister ? "Already configured? Authenticate System" : "Establish brand new production matrix ->"}
          </button>
        </div>
      </div>
    </div>
  );
}

// --- DASHBOARD VIEW MODULE ---
function ViewHome({ data, setData, paid, pending, net, hours, updateTitle, updateGoal }) {

// --- CLIENT LEDGER MODULE ---
function ViewClients({ data, setData }) {
  const [form, setForm] = useState({ name: "", type: "", email: "" });
  
  const addClient = () => {
    if (!form.name) return;
    const nc = { id: Date.now(), name: form.name, type: form.type || "Corporate Node", email: form.email || "internal@verified.film", status: "Active" };
    setData(d => ({ ...d, clients: [...(d.clients || []), nc] }));
    setForm({ name: "", type: "", email: "" });
  };

  const removeClient = (id) => {
    if(confirm("Confirm destructive teardown of this account framework?")) {
      setData(d => ({ ...d, clients: d.clients.filter(c => c.id !== id) }));
    }
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 32 }} className="fade">
      <div>
        <h1 style={{ fontSize: 28, fontWeight: 600, letterSpacing: "-0.03em" }}>Client Index Ledger</h1>
        <p style={{ fontSize: 14, color: "var(--t3)", marginTop: 4 }}>Enterprise networks linked straight to localized secure account blocks.</p>
      </div>

      <Card>
        <p style={{ fontSize: 13, fontWeight: 500, color: "var(--tx)", marginBottom: 14 }}>Ingress Account Node Setup</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr auto", gap: 14, alignItems: "flex-end" }}>
          <Field label="Client Enterprise Identity"><input className="luxury-input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Aether Cinema Corp" /></Field>
          <Field label="Production Tag Variant"><input className="luxury-input" value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} placeholder="Feature Film Group" /></Field>
          <Field label="Secure Comms Pipeline"><input className="luxury-input" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} placeholder="ops@aether.film" /></Field>
          <Btn variant="primary" onClick={addClient} style={{ height: 44 }}>Link System Node</Btn>
        </div>
      </Card>

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {(data.clients || []).map(c => (
          <Card key={c.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 16, flex: 1 }}>
              <div style={{ width: 40, height: 40, borderRadius: 8, background: "var(--c2)", border: "1px solid var(--ln)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 600, color: "var(--ac)" }}>
                {c.name.slice(0, 2).toUpperCase()}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: 1 }}>
                <Editable text={c.name} onSave={v => setData(d => ({ ...d, clients: d.clients.map(item => item.id === c.id ? { ...item, name: v } : item) }))} style={{ fontSize: 15, fontWeight: 500, color: "var(--tx)" }} />
                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--t2)" }}>
                  <Editable text={c.type} onSave={v => setData(d => ({ ...d, clients: d.clients.map(item => item.id === c.id ? { ...item, type: v } : item) }))} />
                  <span style={{ color: "var(--ln3)" }}>•</span>
                  <Editable text={c.email} onSave={v => setData(d => ({ ...d, clients: d.clients.map(item => item.id === c.id ? { ...item, email: v } : item) }))} style={{ color: "var(--t3)" }} />

// --- SECURE WORKSPACE DISPATCHES ---

  const [form, setForm] = useState({ client: "", project: "", url: "" });

  const sendDispatch = () => {
    if (!form.project || !form.url) return;
    const nd = { id: Date.now(), client: form.client || "Generic Cluster", project: form.project, url: form.url, status: "Awaiting Review", sent: new Date().toISOString().split('T')[0] };
    setData(d => ({ ...d, delivery: [...(d.delivery || []), nd] }));
    setForm({ client: "", project: "", url: "" });
  };

        categoryTotals[ex.cat || 'General Array'] = (categoryTotals[ex.cat || 'General Array'] || 0) + Number(ex.amount);

      const labels = Object.keys(categoryTotals).length ? Object.keys(categoryTotals) : ["Software Node Cluster", "Hardware Core Array", "Bandwidth Compute Infrastructure"];
      const dataValues = Object.keys(categoryTotals).length ? Object.values(categoryTotals) : [30, 120, 45];

      chartInstance.current = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Sequence Alpha', 'Sequence Beta', 'Sequence Gamma', 'Sequence Delta', 'Sequence Epsilon', 'Live Node Sync State'],
          datasets: [
            { label: 'Gross Retainer Vector Stream', data: [paid * 0.2, paid * 0.4, paid * 0.5, paid * 0.75, paid * 0.9, paid], borderColor: '#0071E3', backgroundColor: 'rgba(0, 113, 227, 0.05)', fill: true, tension: 0.2 },

            x: { grid: { color: 'rgba(255,255,255,0.02)' }, ticks: { color: '#86868B' } },
            y: { grid: { color: 'rgba(255,255,255,0.02)' }, ticks: { color: '#86868B' } }

    return () => { if (chartInstance.current) { chartInstance.current.destroy(); } };

  return (

      <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 24 }}>

          <p style={{ fontSize: 14, fontWeight: 500, marginBottom: 16 }}>Core Fiscal Flow & Resource Projections</p>
          <div style={{ flex: 1, position: "relative" }}>
            <canvas ref={canvasRef} />
          </div>
        </Card>

        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <Card>
            <p style={{ fontSize: 12, color: "var(--t3)" }}>Operational Execution Coefficent</p>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 12 }}>
              <span style={{ fontSize: 36, fontWeight: 600, letterSpacing: "-0.03em" }}>
