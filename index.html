<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vanguard Core">
  
  <title>Vanguard Studio Core — Enterprise Framework</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    
    /* True Apple iOS Human Interface Tokens */
    :root {
      --bg-system: #000000;
      --material-thick: rgba(22, 22, 23, 0.75);
      --material-thin: rgba(30, 30, 32, 0.45);
      --border-thin: rgba(255, 255, 255, 0.065);
      --border-focus: #FFFFFF;
      --label-primary: #FFFFFF;
      --label-secondary: #8E8E93;
      --label-tertiary: #48484A;
      
      --system-gold: #D4AF37;
      --system-blue: #0A84FF;
      --system-green: #30D158;
      --system-red: #FF453A;
      --system-orange: #FF9F0A;
      --system-indigo: #5E5CE6;
      
      --blur-system: blur(30px);
      --radius-ios: 13px;
      --transition-fluid: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .light-mode {
      --bg-system: #F2F2F7;
      --material-thick: rgba(255, 255, 255, 0.82);
      --material-thin: rgba(242, 242, 247, 0.6);
      --border-thin: rgba(0, 0, 0, 0.055);
      --border-focus: #000000;
      --label-primary: #000000;
      --label-secondary: #636366;
      --label-tertiary: #C7C7CC;
      
      --system-gold: #A5782A;
      --system-blue: #007AFF;
      --system-green: #34C759;
      --system-red: #FF3B30;
      --system-orange: #FF9500;
      --system-indigo: #5856D6;
    }

    html, body, #root { 
      height: 100%; 
      width: 100%; 
      background-color: var(--bg-system); 
      color: var(--label-primary); 
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Core Layout Mechanics */
    .app-canvas {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* Left Drawer / Navigation Interface Module */
    .ios-sidebar {
      width: 260px;
      background: var(--material-thick);
      backdrop-filter: var(--blur-system);
      -webkit-backdrop-filter: var(--blur-system);
      border-right: 0.5px solid var(--border-thin);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }

    .view-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem;
      padding-top: calc(2.5rem + env(safe-area-inset-top));
      padding-bottom: calc(2.5rem + env(safe-area-inset-bottom));
    }

    /* iPhone / Safari Responsive Adaptation Layer */
    @media (max-width: 768px) {
      .app-canvas {
        flex-direction: column-reverse;
      }
      .ios-sidebar {
        width: 100%;
        height: 74px;
        flex-direction: row;
        border-right: none;
        border-top: 0.5px solid var(--border-thin);
        padding: 0 8px;
        padding-bottom: env(safe-area-inset-bottom);
        justify-content: space-around;
        align-items: center;
        z-index: 999;
      }
      .ios-sidebar-brand, .ios-sidebar-footer {
        display: none !important;
      }
      .nav-group {
        flex-direction: row !important;
        width: 100%;
        justify-content: space-around;
        gap: 0 !important;
      }
      .nav-pill {
        flex-direction: column !important;
        align-items: center !important;
        gap: 3px !important;
        font-size: 9px !important;
        padding: 6px 0 !important;
        width: 60px;
        border-radius: 0 !important;
        background: transparent !important;
      }
      .nav-pill i {
        font-size: 21px !important;
      }
      .view-viewport {
        padding: 1.5rem 1.25rem;
        padding-top: calc(1.5rem + env(safe-area-inset-top));
      }
    }

    /* Premium Apple Card Surfaces */
    .apple-surface {
      background: var(--material-thick);
      backdrop-filter: var(--blur-system);
      -webkit-backdrop-filter: var(--blur-system);
      border: 0.5px solid var(--border-thin);
      border-radius: var(--radius-ios);
      padding: 1.5rem;
      box-shadow: 0 4px 34px rgba(0, 0, 0, 0.04);
      margin-bottom: 1.25rem;
      transition: var(--transition-fluid);
    }

    /* iOS System Controls Form Fields */
    .apple-input-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
    }
    
    .apple-input-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--label-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding-left: 2px;
    }

    .apple-input-element {
      background: var(--material-thin);
      border: 0.5px solid var(--border-thin);
      color: var(--label-primary);
      font-size: 16px; 
      padding: 14px 16px;
      border-radius: 11px;
      width: 100%;
      outline: none;
      transition: var(--transition-fluid);
    }
    .apple-input-element:focus {
      border-color: var(--border-focus);
      background: rgba(120, 120, 128, 0.14);
    }

    .apple-action-trigger {
      background: var(--label-primary);
      color: var(--bg-system);
      border: none;
      border-radius: 11px;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .apple-action-trigger:active {
      opacity: 0.65;
    }

    /* Micro Animations */
    @keyframes iosFadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ios-animate-view {
      animation: iosFadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = "https://your-project-id.supabase.co";
const SUPABASE_ANON_KEY = "your-anon-public-key";
const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function App() {
  const [currentView, setCurrentView] = useState("dashboard");
  const [lightAppearanceMode, setLightAppearanceMode] = useState(false);

  // High Fidelity Architectural Enterprise Engine State Data Arrays
  const [clients, setClients] = useState([
    { id: 1, name: "Aether Cinema Corp", type: "VFX Studio Node", pipeline_tier: "Premium Retainer", email: "comms@aether.film" },
    { id: 2, name: "Kaufman Luxury Group", type: "Commercial Agency Portfolio", pipeline_tier: "Per-Project Account", email: "vault@kaufman.co" }
  ]);

  const [projects, setProjects] = useState([
    { id: 1, title: "The Sovereign Identity — Master Assembly", client: "Aether Cinema Corp", stage: "Color Pass Grading", revenue: 8400, structural_progress: 68 },
    { id: 2, title: "Excellence Heritage Campaign 60s Cut", client: "Kaufman Luxury Group", stage: "VFX Composite Engineering", revenue: 4500, structural_progress: 92 }
  ]);

  const [ledgerEntries, setLedgerEntries] = useState([
    { id: 1, label: "Aether Front-End Architecture Clearance", magnitude: 8400, dynamic_type: "inflow", timeline_stamp: "2026-05-20" },
    { id: 2, label: "LTO-9 Cold Storage Matrix Allocation", magnitude: 240, dynamic_type: "outflow", timeline_stamp: "2026-05-18" }
  ]);

  const [integrationChannels, setIntegrationChannels] = useState({
    discordWebhook: "https://discord.com/api/webhooks/...",
    operationalEmail: "executive-node@vanguard.studio",
    discordSyncStatus: "Active Secure Listening",
    emailSyncStatus: "Imap Listening Online"
  });

  const toggleSystemAppearance = () => {
    setLightAppearanceMode(!lightAppearanceMode);
    document.body.classList.toggle("light-mode");
  };

  return (
    <div className="app-canvas">
      
      {/* Structural System Bar Menu */}
      <div className="ios-sidebar">
        <div style={{ width: "100%" }}>
          <div className="ios-sidebar-brand" style={{ padding: "30px 24px 20px 24px", display: "flex", alignItems: "center", gap: "10px" }}>
            <div style={{ width: 28, height: 28, borderRadius: "6px", background: "var(--system-gold)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <i className="ti ti-infinity" style={{ color: "#000", fontSize: 16 }} />
            </div>
            <span style={{ fontSize: 14, fontWeight: 700, letterSpacing: "-0.03em", textTransform: "uppercase" }}>Vanguard Architecture</span>
          </div>

          <div className="nav-group" style={{ display: "flex", flexDirection: "column", gap: "3px", padding: "0 10px" }}>
            {[
              { id: "dashboard", icon: "ti-square-dashboard", label: "Studio Hub" },
              { id: "clients", icon: "ti-users-group", label: "Client Register" },
              { id: "projects", icon: "ti-layers-intersect", label: "Production" },
              { id: "ledger", icon: "ti-receipt-2", label: "Ledger Matrix" },
              { id: "channels", icon: "ti-broadcast", label: "Channels Hub" }
            ].map(item => {
              const isActive = currentView === item.id;
              return (
                <div 
                  key={item.id} 
                  className="nav-pill"
                  onClick={() => setCurrentView(item.id)}
                  style={{
                    display: "flex", alignItems: "center", gap: "12px", padding: "11px 14px", borderRadius: "10px",
                    background: isActive ? "rgba(255,255,255,0.07)" : "transparent",
                    color: isActive ? "var(--label-primary)" : "var(--label-secondary)", cursor: "pointer",
                    transition: "var(--transition-fluid)"
                  }}
                >
                  <i className={`ti ${item.icon}`} style={{ fontSize: 18, color: isActive ? "var(--system-gold)" : "var(--label-secondary)" }} />
                  <span style={{ fontSize: 13, fontWeight: isActive ? 600 : 500, letterSpacing: "-0.01em" }}>{item.label}</span>
                </div>
              );
            })}
          </div>
        </div>

        <div className="ios-sidebar-footer" style={{ padding: "24px", display: "flex", flexDirection: "column", gap: "12px" }}>
          <div onClick={toggleSystemAppearance} style={{ cursor: "pointer", fontSize: 12, color: "var(--label-secondary)", display: "flex", alignItems: "center", gap: "8px" }}>
            <i className={lightAppearanceMode ? "ti ti-moon-stars" : "ti ti-sun-high"} style={{ fontSize: 15 }} />
            <span style={{ fontWeight: 500 }}>System Aesthetics Toggle</span>
          </div>
        </div>
      </div>

      {/* Main Framework Processing Core Views */}
      <div className="view-viewport">
        
        {currentView === "dashboard" && (
          <div className="ios-animate-view">
            <h1 style={{ fontSize: 32, fontWeight: 700, letterSpacing: "-0.05em", marginBottom: "2px" }}>Studio Analytics</h1>
            <p style={{ color: "var(--label-secondary)", fontSize: 14, marginBottom: "28px", letterSpacing: "-0.01em" }}>System Core Telemetry Array</p>
            
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "14px", marginBottom: "20px" }}>
              <div className="apple-surface">
                <span style={{ fontSize: 10, fontWeight: 700, color: "var(--label-secondary)", textTransform: "uppercase", letterSpacing: "0.02em" }}>Yield Conversion Efficiency</span>
                <p style={{ fontSize: 26, fontWeight: 700, color: "var(--system-gold)", marginTop: "8px", letterSpacing: "-0.04em" }}>94.2%</p>
                <div style={{ background: "rgba(255,255,255,0.04)", height: 3, borderRadius: 2, marginTop: 12, overflow: "hidden" }}>
                  <div style={{ width: "94.2%", background: "var(--system-gold)", height: "100%" }} />
                </div>
              </div>
              <div className="apple-surface">
                <span style={{ fontSize: 10, fontWeight: 700, color: "var(--label-secondary)", textTransform: "uppercase", letterSpacing: "0.02em" }}>Gross Liquid Capital Velocity</span>
                <p style={{ fontSize: 26, fontWeight: 700, color: "var(--label-primary)", marginTop: "8px", letterSpacing: "-0.04em" }}>$12,900</p>
                <p style={{ fontSize: 11, color: "var(--system-green)", marginTop: 10, fontWeight: 600 }}><i className="ti ti-trending-up" /> +18.4% Variance Scale</p>
              </div>
            </div>

            <div className="apple-surface">
              <h3 style={{ fontSize: 15, fontWeight: 600, letterSpacing: "-0.02em", marginBottom: "16px" }}>Secure Operational Environment Pipeline Traces</h3>
              <div style={{ display: "flex", flexDirection: "column", gap: "2px" }}>
                {projects.map(p => (
                  <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: "0.5px solid var(--border-thin)" }}>
                    <div>
                      <p style={{ fontSize: 13, fontWeight: 600, letterSpacing: "-0.01em" }}>{p.title}</p>
                      <p style={{ fontSize: 11, color: "var(--label-secondary)" }}>{p.client} • {p.stage}</p>
                    </div>
                    <span style={{ fontSize: 12, fontWeight: 700, color: "var(--system-gold)" }}>{p.structural_progress}%</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {currentView === "clients" && (
          <div className="ios-animate-view">
            <h1 style={{ fontSize: 32, fontWeight: 700, letterSpacing: "-0.05em", marginBottom: "20px" }}>Clients Architecture</h1>
            
            <div className="apple-surface" style={{ display: "flex", flexDirection: "column", gap: "14px", marginBottom: "20px" }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }} className="mobile-stack">
                <div className="apple-input-container">
                  <label className="apple-input-label">Corporate Handle Label</label>
                  <input className="apple-input-element" placeholder="e.g., Aether Cinema" />
                </div>
                <div className="apple-input-container">
                  <label className="apple-input-label">Secure Communications Hub Routing Address</label>
                  <input className="apple-input-element" placeholder="comms@domain.film" />
                </div>
              </div>
              <button className="apple-action-trigger" style={{ background: "var(--system-gold)", color: "#000" }}>Provision New Client Space Array</button>
            </div>

            {clients.map(c => (
              <div key={c.id} className="apple-surface" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <h3 style={{ fontSize: 15, fontWeight: 600, letterSpacing: "-0.02em" }}>{c.name}</h3>
                  <p style={{ fontSize: 12, color: "var(--label-secondary)", marginTop: "2px" }}>{c.email} • {c.type}</p>
                </div>
                <span style={{ fontSize: 11, fontWeight: 600, color: "var(--system-blue)", background: "rgba(10,132,255,0.08)", padding: "5px 10px", borderRadius: "6px" }}>{c.pipeline_tier}</span>
              </div>
            ))}
          </div>
        )}

        {currentView === "projects" && (
          <div className="ios-animate-view">
            <h1 style={{ fontSize: 32, fontWeight: 700, letterSpacing: "-0.05em", marginBottom: "20px" }}>Post Production Architecture</h1>
            {projects.map(p => (
              <div key={p.id} className="apple-surface">
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "14px" }}>
                  <div>
                    <h3 style={{ fontSize: 15, fontWeight: 600, letterSpacing: "-0.02em" }}>{p.title}</h3>
                    <p style={{ fontSize: 12, color: "var(--label-secondary)" }}>Anchor Client Space: {p.client}</p>
                  </div>
                  <span style={{ fontSize: 15, fontWeight: 700, color: "var(--system-gold)", letterSpacing: "-0.03em" }}>${p.revenue.toLocaleString()}</span>
                </div>
                <div style={{ background: "rgba(255,255,255,0.04)", height: "5px", borderRadius: "3px", overflow: "hidden", marginBottom: "10px" }}>
                  <div style={{ width: `${p.structural_progress}%`, background: "var(--system-gold)", height: "100%" }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--label-secondary)", fontWeight: 500 }}>
                  <span>Stage Trace Matrix: {p.stage}</span>
                  <span>Pipeline Render Progression Array: {p.structural_progress}%</span>
                </div>
              </div>
            ))}
          </div>
        )}

        {currentView === "ledger" && (
          <div className="ios-animate-view">
            <h1 style={{ fontSize: 32, fontWeight: 700, letterSpacing: "-0.05em", marginBottom: "20px" }}>Ledger Allocations Matrix</h1>
            <div className="apple-surface" style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              {ledgerEntries.map(e => (
                <div key={e.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: "0.5px solid var(--border-thin)" }}>
                  <div>
                    <p style={{ fontSize: 13, fontWeight: 600, letterSpacing: "-0.01em" }}>{e.label}</p>
                    <p style={{ fontSize: 11, color: "var(--label-secondary)" }}>Timeline Signature: {e.timeline_stamp}</p>
                  </div>
                  <span style={{ fontSize: 14, fontWeight: 700, color: e.dynamic_type === "inflow" ? "var(--system-green)" : "var(--system-red)" }}>
                    {e.dynamic_type === "inflow" ? `+$${e.magnitude.toLocaleString()}` : `-$${e.magnitude.toLocaleString()}`}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        {currentView === "channels" && (
          <div className="ios-animate-view">
            <h1 style={{ fontSize: 32, fontWeight: 700, letterSpacing: "-0.05em", marginBottom: "2px" }}>Unified Channels</h1>
            <p style={{ color: "var(--label-secondary)", fontSize: 14, marginBottom: "24px" }}>External Network Pipelines Control Center Terminal Array</p>
            
            <div className="apple-surface">
              <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "16px" }}>
                <i className="ti ti-brand-discord" style={{ fontSize: 22, color: "var(--system-indigo)" }} />
                <h3 style={{ fontSize: 15, fontWeight: 600, letterSpacing: "-0.01em" }}>Discord Production Telemetry Sync Array</h3>
              </div>
              <div className="apple-input-container" style={{ marginBottom: "12px" }}>
                <label className="apple-input-label">Automated System Hook Core Endpoint Webhook Link Matrix</label>
                <input className="apple-input-element" value={integrationChannels.discordWebhook} onChange={(e) => setIntegrationChannels({...integrationChannels, discordWebhook: e.target.value})} />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 11 }}>
                <span style={{ color: "var(--label-secondary)" }}>Channel Pipeline Node Echo Verification Frame</span>
                <span style={{ fontWeight: 600, color: "var(--system-green)" }}><i className="ti ti-circle-check" /> {integrationChannels.discordSyncStatus}</span>
              </div>
            </div>

            <div className="apple-surface">
              <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "16px" }}>
                <i className="ti ti-mail" style={{ fontSize: 22, color: "var(--system-blue)" }} />
                <h3 style={{ fontSize: 15, fontWeight: 600, letterSpacing: "-0.01em" }}>IMAP Enterprise Communications Router</h3>
              </div>
              <div className="apple-input-container" style={{ marginBottom: "12px" }}>
                <label className="apple-input-label">Director Communications Target Address Node</label>
                <input className="apple-input-element" value={integrationChannels.operationalEmail} onChange={(e) => setIntegrationChannels({...integrationChannels, operationalEmail: e.target.value})} />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 11 }}>
                <span style={{ color: "var(--label-secondary)" }}>Structural Engine Daemon Link Listening Framework State</span>
                <span style={{ fontWeight: 600, color: "var(--system-blue)" }}><i className="ti ti-activity" /> {integrationChannels.emailSyncStatus}</span>
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>

</body>
</html>
