<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EditDesk Ultra Pro — Premium Video Editor CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #030305;
      --c1: #09090e;
      --c2: #101017;
      --c3: #161622;
      --c4: #1d1d2b;
      --c5: #252537;
      --ln: rgba(255, 255, 255, 0.05);
      --ln2: rgba(255, 255, 255, 0.09);
      --ln3: rgba(255, 255, 255, 0.16);
      --tx: #f5f5f7;
      --t2: #a1a1aa;
      --t3: #71717a;
      --t4: #3f3f46;
      --ac: #ff4500;
      --ach: #ff5714;
      --acl: rgba(255, 69, 0, 0.12);
      --acl2: rgba(255, 69, 0, 0.06);
      --glass: rgba(16, 16, 23, 0.7);
      --blur: blur(20px);
      --sh: 0 4px 30px rgba(0, 0, 0, 0.4);
      --sh2: 0 12px 40px rgba(0, 0, 0, 0.6);
      --sh-glow: 0 0 20px rgba(255, 69, 0, 0.15);
      --gr: #34c759;
      --grl: rgba(52, 199, 89, 0.12);
      --bl: #007aff;
      --bll: rgba(0, 122, 255, 0.12);
      --ye: #ff9500;
      --yel: rgba(255, 149, 0, 0.12);
      --re: #ff3b30;
      --rel: rgba(255, 59, 48, 0.12);
    }

    .light-mode {
      --bg: #f5f5f7;
      --c1: #ffffff;
      --c2: #f2f2f7;
      --c3: #e5e5ea;
      --c4: #d1d1d6;
      --c5: #aeaeb2;
      --ln: rgba(0, 0, 0, 0.05);
      --ln2: rgba(0, 0, 0, 0.09);
      --ln3: rgba(0, 0, 0, 0.15);
      --tx: #1c1c1e;
      --t2: #48484a;
      --t3: #8e8e93;
      --t4: #aeaeaebd;
      --ac: #ff4500;
      --ach: #e03d00;
      --acl: rgba(255, 69, 0, 0.15);
      --acl2: rgba(255, 69, 0, 0.08);
      --glass: rgba(255, 255, 255, 0.8);
      --blur: blur(20px);
      --sh: 0 4px 20px rgba(0, 0, 0, 0.05);
      --sh2: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    html, body, #root { height: 100%; width: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background-color 0.3s ease; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--ln3); border-radius: 10px; }
    input, select, textarea { outline: none; font-family: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .fade { animation: fadeUp .4s cubic-bezier(.16, 1, .3, 1) both; }
    
    /* Contenteditable styling */
    [contenteditable="true"] {
      border-radius: 4px;
      padding: 1px 4px;
      transition: all 0.2s ease;
      display: inline-block;
    }
    [contenteditable="true"]:hover {
      background: var(--ln2);
      box-shadow: 0 0 0 1px var(--ln3);
    }
    [contenteditable="true"]:focus {
      background: var(--c3);
      outline: none;
      box-shadow: 0 0 0 2px var(--ac);
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const STORAGE_KEY = "editdesk_ultra_pro_v2_data";

const defaultData = {
  profile: { name: "Alex Rivera", studio: "Vivid Cut Studios", avatar: "AR", color: "#ff4500", lightMode: false, showGlows: true },
  dashboardTitles: { totalRevenue: "Total Revenue", pending: "Pending Funds", netProfit: "Net Profit", hoursLogged: "Hours Tracker" },
  clients: [
    { id: 1, name: "Nexus Tech Channel", type: "YouTube Engine", email: "contact@nexus.io", status: "Active" },
    { id: 2, name: "Sarah Jenkins Commercials", type: "Reels Content", email: "sarah@reels.co", status: "Active" },
    { id: 3, name: "Vanguard Enterprise Films", type: "Corporate Media", email: "info@vanguard.com", status: "Active" }
  ],
  projects: [
    { id: 1, title: "Episode 104: Quantum Systems Review", client: "Nexus Tech Channel", status: "In Progress", value: 1200, editProgress: 65, deadline: "2026-06-12", priority: "High" },
    { id: 2, title: "Summer Line Drop Promo Main Cut", client: "Sarah Jenkins Commercials", status: "Review", value: 850, editProgress: 90, deadline: "2026-06-04", priority: "Medium" },
    { id: 3, title: "Global Expansion Manifesto 2026", client: "Vanguard Enterprise Films", status: "In Progress", value: 3400, editProgress: 25, deadline: "2026-06-25", priority: "High" }
  ],
  logs: [
    { id: 1, client: "Nexus Tech Channel", project: "Episode 104", task: "VFX Grading Pass", duration: 7200, date: "2026-05-20" },
    { id: 2, client: "Sarah Jenkins Commercials", project: "Summer Line Drop", task: "Sound Mix Syncing", duration: 4100, date: "2026-05-18" }
  ],
  earnings: [
    { id: 1, label: "Nexus Tech — Apr Base Milestone", amount: 1200, date: "2026-04-28", status: "Paid" },
    { id: 2, label: "Sarah Jenkins — Reels Package 1", amount: 850, date: "2026-04-15", status: "Paid" },
    { id: 3, label: "Vanguard — Q2 Retainer Front", amount: 3400, date: "2026-05-01", status: "Paid" },
    { id: 4, label: "Nexus Tech — Episode 104 Finalization", amount: 1200, date: "2026-05-22", status: "Pending" }
  ],
  expenses: [
    { id: 1, name: "Adobe Creative Cloud Suite", amount: 59.99, cat: "Software", date: "2026-05-01" },
    { id: 2, name: "Epidemic Audio Engine Tier", amount: 29.00, cat: "Audio", date: "2026-05-01" },
    { id: 3, name: "Frame.io Team Workspace", amount: 50.00, cat: "Delivery", date: "2026-05-01" }
  ],
  delivery: [
    { id: 1, client: "Nexus Tech Channel", project: "Episode 104 Cut 2", url: "https://frame.io/share/nx-78", status: "Awaiting Review", sent: "2026-05-21" },
    { id: 2, client: "Sarah Jenkins Commercials", project: "Summer Drop V3", url: "https://drive.google.com/drive/sh-9", status: "Approved", sent: "2026-05-19" }
  ],
  templates: [
    { id: 1, title: "Review Draft Link Delivery", subject: "Review Cut Ready — {project}", body: "Hey {name},\n\nYour review timeline pass for \"{project}\" is now online. Leave any requested markers on the workspace frame link below.\n\nWorkspace Link: {link}\n\nBest,\n{studio}" },
    { id: 2, title: "Final Archive & Master Release", subject: "Masters Dispatched — {project}", body: "Hi {name},\n\nAll high-fidelity final renders for \"{project}\" are processed. Your production archive package and matching files are at the link below.\n\nSecure Mirror Download: {link}\n\nBest,\n{studio}" }
  ],
  goals: { monthlyRevenue: 10000 }
};

// Generic UI Building Blocks
const Badge = ({ color = "dim", children }) => {
  const scheme = {
    green: ["var(--grl)", "var(--gr)"], blue: ["var(--bll)", "var(--bl)"],
    yellow: ["var(--yel)", "var(--ye)"], red: ["var(--rel)", "var(--re)"],
    ac: ["var(--acl)", "var(--ac)"], dim: ["var(--ln)", "var(--t2)"]
  }[color] || ["var(--ln)", "var(--t2)"];
  return <span style={{ background: scheme[0], color: scheme[1], display: "inline-flex", alignItems: "center", fontSize: 10, fontWeight: 600, padding: "2px 8px", borderRadius: 6, textTransform: "uppercase", letterSpacing: "0.04em" }}>{children}</span>
};

const Editable = ({ text, onSave, tag: Tag = "span", numeric = false, style = {} }) => {
  const blurHandler = (e) => {
    let val = e.target.innerText.trim();
    if (numeric) {
      val = parseFloat(val.replace(/[^0-9.-]/g, "")) || 0;
    }
    onSave(val);
  };
  const keyHandler = (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
  return <Tag contentEditable="true" suppressContentEditableWarning onBlur={blurHandler} onKeyDown={keyHandler} style={{ minWidth: "20px", display: "inline-block", ...style }}>{text}</Tag>;
};

const Card = ({ children, style = {}, glow = false, globalGlow = true }) => (
  <div style={{ background: "var(--c1)", border: `1px solid var(--ln)`, borderRadius: 16, padding: "1.25rem", boxShadow: (glow && globalGlow) ? "var(--sh-glow)" : "var(--sh)", transition: "all 0.25s ease", ...style }}>
    {children}
  </div>
);

const Btn = ({ children, variant = "ghost", onClick, style = {} }) => {
  const styles = {
    primary: { background: "var(--ac)", color: "#fff", fontWeight: 600 },
    ghost: { background: "var(--c3)", color: "var(--tx)", border: `1px solid var(--ln2)` },
    danger: { background: "var(--rel)", color: "var(--re)", border: `1px solid rgba(255,59,48,0.2)` }
  }[variant];
  return <button onClick={onClick} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, padding: "8px 14px", borderRadius: 10, transition: "opacity 0.15s", fontWeight: 500, ...styles, ...style }} onMouseEnter={e => e.currentTarget.style.opacity = 0.85} onMouseLeave={e => e.currentTarget.style.opacity = 1}>{children}</button>
};

const Field = ({ label, children }) => (
  <div style={{ display: "flex", flexDirection: "column", gap: 5 }}><p style={{ fontSize: 10, color: "var(--t3)", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</p>{children}</div>
);

export default function App() {
  const [data, setData] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : defaultData;
  });
  const [page, setPage] = useState("home");

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    if (data.profile.lightMode) document.body.classList.add("light-mode");
    else document.body.classList.remove("light-mode");
  }, [data]);

  // Sync operations helpers
  const updateProfile = (key, val) => setData(d => ({ ...d, profile: { ...d.profile, [key]: val } }));
  const updateGoal = (val) => setData(d => ({ ...d, goals: { ...d.goals, monthlyRevenue: val } }));
  const updateDashboardTitle = (key, val) => setData(d => ({ ...d, dashboardTitles: { ...d.dashboardTitles, [key]: val } }));

  // Dynamic calculations based on state arrays
  const paidEarnings = useMemo(() => data.earnings.filter(e => e.status === "Paid").reduce((acc, curr) => acc + Number(curr.amount), 0), [data.earnings]);
  const pendingEarnings = useMemo(() => data.earnings.filter(e => e.status === "Pending").reduce((acc, curr) => acc + Number(curr.amount), 0), [data.earnings]);
  const absoluteExpenses = useMemo(() => data.expenses.reduce((acc, curr) => acc + Number(curr.amount), 0), [data.expenses]);
  const systemNetProfit = paidEarnings - absoluteExpenses;
  const loggedTotalSeconds = useMemo(() => data.logs.reduce((acc, curr) => acc + Number(curr.duration), 0), [data.logs]);

  return (
    <div style={{ display: "flex", height: "100vh", width: "100vw", background: "var(--bg)", color: "var(--tx)" }}>
      {/* Sidebar navigation panel */}
      <div style={{ width: 240, background: "var(--c1)", borderRight: `1px solid var(--ln)`, display: "flex", flexDirection: "column", justifySpaceBetween: "space-between" }}>
        <div>
          <div style={{ padding: "1.5rem", display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid var(--ln)` }}>
            <div style={{ width: 32, height: 32, borderRadius: 10, background: "var(--ac)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: data.profile.showGlows ? "0 0 12px var(--ac)" : "none" }}>
              <i className="ti ti-cut" style={{ color: "#fff", fontSize: 16 }} />
            </div>
            <div>
              <Editable text={data.profile.studio} onSave={v => updateProfile("studio", v)} tag="p" style={{ fontSize: 13, fontWeight: 700, color: "var(--tx)" }} />
              <p style={{ fontSize: 9, color: "var(--ac)", fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>Ultra Custom CRM</p>
            </div>
          </div>

          <div style={{ padding: "1rem", display: "flex", flexDirection: "column", gap: 2 }}>
            {[
              { id: "home", icon: "ti-smart-home", label: "Dashboard" },
              { id: "clients", icon: "ti-users-group", label: "Client Roster" },
              { id: "projects", icon: "ti-layers-intersect", label: "Production Pipe" },
              { id: "finances", icon: "ti-wallet", label: "Financial Ledger" },
              { id: "delivery", icon: "ti-cloud-upload", label: "Deliveries" },
              { id: "templates", icon: "ti-mail-opened", label: "Communications" },
              { id: "analytics", icon: "ti-chart-arcs", label: "Business Analytics" }
            ].map(item => {
              const active = page === item.id;
              return (
                <button key={item.id} onClick={() => setPage(item.id)} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", padding: "10px 14px", borderRadius: 12, background: active ? "var(--acl2)" : "transparent", color: active ? "var(--tx)" : "var(--t2)", transition: "all 0.15s ease", border: active ? "1px solid var(--ln2)" : "1px solid transparent", textAlign: "left" }}>
                  <i className={`ti ${item.icon}`} style={{ fontSize: 16, color: active ? "var(--ac)" : "var(--t3)" }} />
                  <span style={{ fontSize: 13, fontWeight: active ? 600 : 400 }}>{item.label}</span>
                </button>
              )
            })}
          </div>
        </div>

        <div style={{ padding: "1rem", borderTop: `1px solid var(--ln)` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => setPage("settings")}>
            <div style={{ width: 36, height: 36, borderRadius: "50%", background: "var(--c4)", border: `1px solid var(--ln3)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, color: "var(--ac)" }}>
              {data.profile.avatar}
            </div>
            <div style={{ flex: 1, overflow: "hidden" }}>
              <p style={{ fontSize: 12, fontWeight: 600, color: "var(--tx)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{data.profile.name}</p>
              <p style={{ fontSize: 10, color: "var(--t3)" }}><i className="ti ti-settings" style={{ marginRight: 2 }} /> Studio Profiles</p>
            </div>
          </div>
        </div>
      </div>

      {/* Main Dynamic Viewport */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflowY: "auto", padding: "2rem" }}>
        {page === "home" && <ViewHome data={data} setData={setData} paid={paidEarnings} pending={pendingEarnings} net={systemNetProfit} hours={loggedTotalSeconds} updateTitle={updateDashboardTitle} updateGoal={updateGoal} />}
        {page === "clients" && <ViewClients data={data} setData={setData} />}
        {page === "projects" && <ViewProjects data={data} setData={setData} />}
        {page === "finances" && <ViewFinances data={data} setData={setData} paid={paidEarnings} pending={pendingEarnings} expenses={absoluteExpenses} net={systemNetProfit} />}
        {page === "delivery" && <ViewDelivery data={data} setData={setData} />}
        {page === "templates" && <ViewTemplates data={data} setData={setData} />}
        {page === "analytics" && <ViewAnalytics data={data} paid={paidEarnings} pending={pendingEarnings} expenses={absoluteExpenses} net={systemNetProfit} />}
        {page === "settings" && <ViewSettings data={data} setData={setData} updateProfile={updateProfile} />}
      </div>
    </div>
  );
}

// ---------------- SUB VIEWS ----------------

function ViewHome({ data, setData, paid, pending, net, hours, updateTitle, updateGoal }) {
  const activeProjs = data.projects.filter(p => p.status !== "Completed");
  const revProgress = Math.min(100, (paid / (data.goals?.monthlyRevenue || 1)) * 100);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }} className="fade">
      <div>
        <h1 style={{ fontSize: 24, fontWeight: 800, letterSpacing: "-0.02em" }}>Active Workspace</h1>
        <p style={{ fontSize: 13, color: "var(--t3)" }}>Click directly on any number or title metric label to adjust system metrics instantly.</p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 16 }}>
        <Card glow>
          <Editable text={data.dashboardTitles.totalRevenue} onSave={v => updateTitle("totalRevenue", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 2, marginTop: 6, color: "var(--gr)" }}>
            <span style={{ fontSize: 22, fontWeight: 800 }}>$</span>
            <Editable text={paid} numeric onSave={v => {
              setData(d => ({ ...d, earnings: [{ id: Date.now(), label: "Manual Direct Adjustment Adjustment", amount: v, date: "2026-05-22", status: "Paid" }] }));
            }} style={{ fontSize: 26, fontWeight: 800 }} />
          </div>
          <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 4 }}>Auto calculated cash ledger</p>
        </Card>

        <Card>
          <Editable text={data.dashboardTitles.pending} onSave={v => updateTitle("pending", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 2, marginTop: 6, color: "var(--ye)" }}>
            <span style={{ fontSize: 22, fontWeight: 800 }}>$</span>
            <Editable text={pending} numeric onSave={v => {
              setData(d => ({ ...d, earnings: [...d.earnings.filter(e => e.status !== "Pending"), { id: Date.now(), label: "Pending Pipeline Value Holder", amount: v, date: "2026-05-22", status: "Pending" }] }));
            }} style={{ fontSize: 26, fontWeight: 800 }} />
          </div>
          <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 4 }}>Pipelines review processing</p>
        </Card>

        <Card>
          <Editable text={data.dashboardTitles.netProfit} onSave={v => updateTitle("netProfit", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 2, marginTop: 6, color: net >= 0 ? "var(--gr)" : "var(--re)" }}>
            <span style={{ fontSize: 22, fontWeight: 800 }}>$</span>
            <span style={{ fontSize: 26, fontWeight: 800 }}>{net.toLocaleString()}</span>
          </div>
          <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 4 }}>Gross income minus expenses</p>
        </Card>

        <Card>
          <Editable text={data.dashboardTitles.hoursLogged} onSave={v => updateTitle("hoursLogged", v)} style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase" }} />
          <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginTop: 6, color: "var(--bl)" }}>
            <span style={{ fontSize: 26, fontWeight: 800 }}>{Math.floor(hours / 3600)}</span>
            <span style={{ fontSize: 13, fontWeight: 500, color: "var(--t2)" }}>hrs logged</span>
          </div>
          <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 4 }}>Calculated track loops</p>
        </Card>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 20 }}>
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem" }}>
            <div>
              <p style={{ fontSize: 11, color: "var(--t3)", fontWeight: 700, textTransform: "uppercase" }}>Active Pipelines</p>
              <p style={{ fontSize: 13, color: "var(--t2)", marginTop: 2 }}>Inline content editable values</p>
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {activeProjs.map(p => (
              <div key={p.id} style={{ background: "var(--c2)", border: "1px solid var(--ln)", borderRadius: 12, padding: "12px 16px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <Editable text={p.title} onSave={v => setData(d => ({ ...d, projects: d.projects.map(pr => pr.id === p.id ? { ...pr, title: v } : pr) }))} style={{ fontSize: 13, fontWeight: 600, color: "var(--tx)" }} />
                    <Badge color={p.status === "Review" ? "yellow" : "ac"}>{p.status}</Badge>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 2, color: "var(--gr)", fontSize: 13, fontWeight: 700 }}>
                    <span>$</span>
                    <Editable text={p.value} numeric onSave={v => setData(d => ({ ...d, projects: d.projects.map(pr => pr.id === p.id ? { ...pr, value: Number(v) } : pr) }))} />
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ flex: 1, background: "var(--ln2)", height: 4, borderRadius: 2 }}>
                    <div style={{ width: `${p.editProgress}%`, background: "var(--ac)", height: "100%", borderRadius: 2 }} />
                  </div>
                  <div style={{ fontSize: 11, color: "var(--t2)", display: "flex", alignItems: "center" }}>
                    <Editable text={p.editProgress} numeric onSave={v => setData(d => ({ ...d, projects: d.projects.map(pr => pr.id === p.id ? { ...pr, editProgress: Math.min(100, Math.max(0, Number(v))) } : pr) }))} />%
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>

        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <Card>
            <p style={{ fontSize: 10, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase" }}>Monthly Goal Engine</p>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", margin: "10px 0 6px" }}>
              <span style={{ fontSize: 20, fontWeight: 700, color: "var(--gr)" }}>${paid.toLocaleString()}</span>
              <span style={{ fontSize: 11, color: "var(--t3)" }}>
                target: $<Editable text={data.goals?.monthlyRevenue} numeric onSave={v => updateGoal(v)} style={{ fontWeight: 600 }} />
              </span>
            </div>
            <div style={{ background: "var(--ln2)", height: 6, borderRadius: 3, overflow: "hidden", marginBottom: 6 }}>
              <div style={{ width: `${revProgress}%`, background: "var(--gr)", height: "100%" }} />
            </div>
            <p style={{ fontSize: 10, color: "var(--t3)" }}>{revProgress.toFixed(0)}% Completed</p>
          </Card>

          <Card style={{ background: "linear-gradient(135deg, var(--c1) 0%, var(--acl2) 100%)" }}>

              <select value={del.status} onChange={e => updateDeliveryField(del.id, "status", e.target.value)} style={{ background: "var(--c2)", border: "1px solid var(--ln2)", color: "var(--tx)", fontSize: 11, padding: "4px 8px", borderRadius: 6 }}>
                <option value="Awaiting Review">Awaiting Review</option>
                <option value="Approved">Approved</option>
                <option value="Changes Requested">Changes Requested</option>
              </select>
              <button onClick={() => deleteDelivery(del.id)} style={{ color: "var(--t4)", padding: 4 }} onMouseEnter={e => e.currentTarget.style.color = "var(--re)"} onMouseLeave={e => e.currentTarget.style.color = "var(--t4)"}>
                <i className="ti ti-trash" style={{ fontSize: 16 }} />
              </button>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function ViewTemplates({ data, setData }) {
  const [form, setForm] = useState({ title: "", subject: "", body: "" });

  const addTemplate = () => {
    if (!form.title) return;
    const nt = { id: Date.now(), title: form.title, subject: form.subject || "Project update", body: form.body || "Hello" };
    setData(d => ({ ...d, templates: [...d.templates, nt] }));
    setForm({ title: "", subject: "", body: "" });
  };

  const deleteTemplate = (id) => setData(d => ({ ...d, templates: d.templates.filter(t => t.id !== id) }));
  const updateTemplateField = (id, key, value) => setData(d => ({ ...d, templates: d.templates.map(t => t.id === id ? { ...t, [key]: value } : t) }));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }} className="fade">
      <div>
        <h1 style={{ fontSize: 24, fontWeight: 800, letterSpacing: "-0.02em" }}>Communications System</h1>
        <p style={{ fontSize: 13, color: "var(--t3)" }}>Fully interactive copy-paste workspace dispatch templates. Click fields inside blocks to edit blocks directly.</p>
      </div>

      <Card>
        <p style={{ fontSize: 11, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase", marginBottom: 12 }}>Assemble Communication Layout Matrix</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} style={{ background: "var(--c2)", border: "1px solid var(--ln2)", padding: "8px 12px", borderRadius: 10, color: "var(--tx)", fontSize: 13 }} placeholder="System Protocol Layout Key (e.g. Mid Cut Dispatched Layout)" />
            <input value={form.subject} onChange={e => setForm({ ...form, subject: e.target.value })} style={{ background: "var(--c2)", border: "1px solid var(--ln2)", padding: "8px 12px", borderRadius: 10, color: "var(--tx)", fontSize: 13 }} placeholder="Email Subject Header String" />
          </div>
          <textarea value={form.body} onChange={e => setForm({ ...form, body: e.target.value })} style={{ background: "var(--c2)", border: "1px solid var(--ln2)", padding: "10px 12px", borderRadius: 10, color: "var(--tx)", fontSize: 13, minHeight: 70, resize: "vertical" }} placeholder="Body content block array context parameters..." />
          <Btn variant="primary" onClick={addTemplate} style={{ alignSelf: "flex-end" }}><i className="ti ti-clipboard-list" /> Inject Block</Btn>
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 16 }}>
        {data.templates.map(t => (
          <Card key={t.id}>
            <div style={{ display: "flex", justifySpaceBetween: "space-between", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid var(--ln)", paddingBottom: 10, marginBottom: 10 }}>
              <Editable text={t.title} onSave={v => updateTemplateField(t.id, "title", v)} style={{ fontSize: 14, fontWeight: 700, color: "var(--ac)" }} />
              <button onClick={() => deleteTemplate(t.id)} style={{ color: "var(--t4)" }} onMouseEnter={e => e.currentTarget.style.color = "var(--re)"} onMouseLeave={e => e.currentTarget.style.color = "var(--t4)"}>
                <i className="ti ti-trash" style={{ fontSize: 15 }} />
              </button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <div style={{ fontSize: 12, color: "var(--t2)" }}>
                <span style={{ color: "var(--t3)", fontWeight: 600 }}>Subject Line:</span> <Editable text={t.subject} onSave={v => updateTemplateField(t.id, "subject", v)} style={{ width: "80%" }} />
              </div>
              <div style={{ background: "var(--c2)", border: "1px solid var(--ln)", borderRadius: 10, padding: 12, fontSize: 12, color: "var(--tx)", whiteSpace: "pre-wrap", fontFamily: "monospace" }}>
                <Editable text={t.body} onSave={v => updateTemplateField(t.id, "body", v)} style={{ width: "100%", display: "block" }} />
              </div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function ViewAnalytics({ paid, pending, expenses, net }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (chartRef.current) {
      if (chartInstance.current) chartInstance.current.destroy();

      const isDark = !document.body.classList.contains("light-mode");
      const gridColor = isDark ? "rgba(255, 255, 255, 0.05)" : "rgba(0, 0, 0, 0.05)";
      const labelColor = isDark ? "#a1a1aa" : "#48484a";

      const ctx = chartRef.current.getContext("2d");
      chartInstance.current = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Liquid Income", "Pipeline Hold", "Loss Operational", "Yield Yield"],
          datasets: [{
            label: "Value Matrix Core Account Level ($)",
            data: [paid, pending, expenses, net],
            backgroundColor: ["#34c759", "#ff9500", "#ff3b30", "#007aff"],
            borderRadius: 8,
            borderWidth: 0,
            barThickness: 32
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              grid: { color: gridColor },
              ticks: { color: labelColor, font: { family: "-apple-system" } }
            },
            x: {
              grid: { display: false },
              ticks: { color: labelColor, font: { family: "-apple-system" } }
            }
          }
        }
      });
    }
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [paid, pending, expenses, net]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }} className="fade">
      <div>
        <h1 style={{ fontSize: 24, fontWeight: 800, letterSpacing: "-0.02em" }}>Business Analytics Processing Engine</h1>
        <p style={{ fontSize: 13, color: "var(--t3)" }}>Realtime analytical evaluation processing loop calculations engine matrices.</p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 20 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Card>
            <p style={{ fontSize: 10, color: "var(--t3)", fontWeight: 700, textTransform: "uppercase" }}>Liquid Conversion Optimization Rate</p>
            <p style={{ fontSize: 24, fontWeight: 800, marginTop: 4, color: "var(--gr)" }}>
              {((paid / (paid + pending || 1)) * 100).toFixed(1)}%
            </p>
            <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 2 }}>Conversion of total backlog valuation pipeline assets to paid settlement arrays.</p>
          </Card>
          <Card>
            <p style={{ fontSize: 10, color: "var(--t3)", fontWeight: 700, textTransform: "uppercase" }}>Operating Cost Margin Index</p>
            <p style={{ fontSize: 24, fontWeight: 800, marginTop: 4, color: "var(--re)" }}>
              {((expenses / (paid || 1)) * 100).toFixed(1)}%
            </p>
            <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 2 }}>Operational drag ratio factor relative to total cash ledger deposits tracking loops.</p>
          </Card>
        </div>

        <Card style={{ minHeight: 280, display: "flex", flexDirection: "column" }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase", marginBottom: 16 }}>Ledger Performance Visual Matrix Graph</p>
          <div style={{ flex: 1, position: "relative" }}>
            <canvas ref={chartRef}></canvas>
          </div>
        </Card>
      </div>
    </div>
  );
}

    <div style={{ display: "flex", flexDirection: "column", gap: 24 }} className="fade">
      <div>
        <h1 style={{ fontSize: 24, fontWeight: 800, letterSpacing: "-0.02em" }}>System Variables Workspace</h1>
        <p style={{ fontSize: 13, color: "var(--t3)" }}>Configure interface theme structures, toggle engine switches, and change local storage arrays.</p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
        <Card style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase" }}>Identity Token Context Configuration</p>
          
          <div style={{ display: "grid", gridTemplateColumns: "1fr 3fr", gap: 12 }}>
            <Field label="Avatar Node"><input value={data.profile.avatar} onChange={e => updateProfile("avatar", e.target.value.toUpperCase().slice(0,2))} style={{ background: "var(--c2)", border: "1px solid var(--ln2)", padding: "8px 12px", borderRadius: 10, color: "var(--tx)", fontSize: 13, textAlign: "center", fontWeight: 700 }} /></Field>
            <Field label="Identity Signature Handle Identification"><input value={data.profile.name} onChange={e => updateProfile("name", e.target.value)} style={{ background: "var(--c2)", border: "1px solid var(--ln2)", padding: "8px 12px", borderRadius: 10, color: "var(--tx)", fontSize: 13 }} /></Field>
          </div>
        </Card>

        <Card style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: "var(--t3)", textTransform: "uppercase" }}>Interface Mode Controllers</p>
          
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", justifySpaceBetween: "space-between", justifyContent: "space-between" }}>
              <div>
                <p style={{ fontSize: 13, fontWeight: 600 }}>System Light Mode Framework</p>
                <p style={{ fontSize: 11, color: "var(--t3)" }}>Flip base layout colors to high ambient reflectivity index parameters.</p>
              </div>
              <input type="checkbox" checked={data.profile.lightMode} onChange={e => updateProfile("lightMode", e.target.checked)} style={{ width: 40, height: 20, accentColor: "var(--ac)", cursor: "pointer" }} />
            </div>

            <div style={{ display: "flex", alignItems: "center", justifySpaceBetween: "space-between", justifyContent: "space-between", borderTop: "1px solid var(--ln)", paddingTop: 12 }}>
              <div>
                <p style={{ fontSize: 13, fontWeight: 600 }}>Premium Card Glow Radiance</p>
                <p style={{ fontSize: 11, color: "var(--t3)" }}>Project targeted visual highlight radiance backdrops underneath containers.</p>
              </div>
              <input type="checkbox" checked={data.profile.showGlows} onChange={e => updateProfile("showGlows", e.target.checked)} style={{ width: 40, height: 20, accentColor: "var(--ac)", cursor: "pointer" }} />
            </div>
          </div>
        </Card>
      </div>

      <Card style={{ border: "1px solid rgba(255,59,48,0.2)", background: "rgba(255,59,48,0.02)" }}>
        <p style={{ fontSize: 11, fontWeight: 700, color: "var(--re)", textTransform: "uppercase" }}>Danger Layer Root Clearance</p>
        <p style={{ fontSize: 12, color: "var(--t2)", marginTop: 4, marginBottom: 12 }}>Wipe the entire system storage cache configuration state structure block to defaults instantly.</p>
        <Btn variant="danger" onClick={() => { if(confirm("Purge absolute configuration arrays?")) { localStorage.removeItem(STORAGE_KEY); window.location.reload(); } }}><i className="ti ti-refresh-alert" /> Wipe & Purge Storage Engine Cache</Btn>
      </Card>
    </div>
  );
}

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
