<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditDesk Pro Workspace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin: 0; background: #09090b; min-height: 100vh; color: #f4f4f5;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // ── APPLE DARK DESIGN SYSTEM TOKENS
        const T = {
          bg: "#09090b", c1: "#121214", c2: "#18181b", c3: "#27272a", c4: "#3f3f46",
          ln: "rgba(255,255,255,0.06)", ln2: "rgba(255,255,255,0.12)",
          tx: "#f4f4f5", t2: "#a1a1aa", t3: "#71717a", t4: "#52525b",
          ac: "#e05638", ach: "#c8472b", acs: "rgba(224,86,56,0.1)",
          gr: "#22c55e", grs: "rgba(34,197,94,0.1)",
          bl: "#3b82f6", bls: "rgba(59,130,246,0.1)",
          ye: "#eab308", yes: "rgba(234,179,8,0.1)",
          re: "#ef4444", res: "rgba(239,68,68,0.1)",
          pu: "#a855f7", pus: "rgba(168,85,247,0.1)",
          ff: "-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif",
          r: "8px", rM: "12px", rL: "16px"
        };

        const AVC = [["#1e1b4b","#818cf8"],["#064e3b","#34d399"],["#7c2d12","#fb923c"],["#581c87","#c084fc"]];
        const SK = "editdesk_pro_v1";

        // ── CORE DATA UTILITIES (LOCAL STORAGE)
        const loadData = (key, fallback) => {
          try {
            const saved = localStorage.getItem(`${SK}_${key}`);
            return saved ? JSON.parse(saved) : fallback;
          } catch { return fallback; }
        };
        const saveData = (key, data) => {
          try { localStorage.setItem(`${SK}_${key}`, JSON.stringify(data)); } catch {}
        };

        // ── TIME HELPERS
        const fmtSec = (s) => {
          const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
          return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;
        };

        // ── REUSABLE MINI COMPONENTS
        function Av({ label="", idx=0, size=36 }) {
          const [bg,fg] = AVC[idx % AVC.length] || AVC[0];
          return <div style={{ width:size, height:size, borderRadius:"50%", background:bg, color:fg, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:600, fontSize:size*0.32, flexShrink:0 }}>{label}</div>;
        }

        function Chip({ children, color="dim" }) {
          const m = { green:[T.grs,T.gr], blue:[T.bls,T.bl], yellow:[T.yes,T.ye], red:[T.res,T.re], ac:[T.acs,T.ac], purple:[T.pus,T.pu], dim:["rgba(255,255,255,0.04)",T.t2] };
          const [bg,fg] = m[color] || m.dim;
          return <span style={{ background:bg, color:fg, fontSize:10, fontWeight:600, padding:"2px 8px", borderRadius:12, letterSpacing:".02em" }}>{children}</span>;
        }

        function Card({ children, style={}, onClick }) {
          const [hov, sh] = useState(false);
          return <div onClick={onClick} onMouseEnter={()=>sh(true)} onMouseLeave={()=>sh(false)}
            style={{ background:T.c1, border:`1px solid ${hov&&onClick?T.ln2:T.ln}`, borderRadius:T.rM, padding:"1.25rem", transition:"all .2s", cursor:onClick?"pointer":"default", ...style }}>
            {children}
          </div>;
        }

        function FI({ style={}, ...p }) {
          return <input {...p} style={{ background:T.c2, border:`1px solid ${T.ln}`, borderRadius:T.r, color:T.tx, fontSize:13, padding:"8px 12px", outline:"none", width:"100%", boxSizing:"border-box", fontFamily:T.ff, transition:"border-color .15s", ...style }}
            onFocus={e => e.target.style.borderColor = T.ac} onBlur={e => e.target.style.borderColor = T.ln} />;
        }

        function FS({ children, style={}, ...p }) {
          return <select {...p} style={{ background:T.c2, border:`1px solid ${T.ln}`, borderRadius:T.r, color:T.tx, fontSize:13, padding:"8px 12px", outline:"none", width:"100%", boxSizing:"border-box", fontFamily:T.ff, ...style }}>{children}</select>;
        }

        function Btn({ children, v="ghost", style={}, ...p }) {
          const [hov, sh] = useState(false);
          const base = { display:"inline-flex", alignItems:"center", gap:6, padding:"8px 14px", borderRadius:T.r, fontSize:13, fontWeight:500, cursor:"pointer", border:"none", transition:"all .15s", fontFamily:T.ff };
          const vs = {
            primary: { background:hov?T.ach:T.ac, color:"#fff" },
            ghost:   { background:hov?"rgba(255,255,255,.06)":"rgba(255,255,255,.02)", color:T.tx, border:`1px solid ${T.ln}` },
            danger:  { background:hov?T.res:"transparent", color:T.re, border:`1px solid ${T.res}` },
            delSmall:{ background: hov ? "rgba(239,68,68,0.15)" : "transparent", color: T.t3, padding: "4px 6px", borderRadius: T.r }
          };
          return <button {...p} onMouseEnter={()=>sh(true)} onMouseLeave={()=>sh(false)} style={{ ...base, ...(vs[v]||vs.ghost), ...style }}>{children}</button>;
        }

        function Modal({ children, onClose }) {
          return <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.75)", zIndex:400, display:"flex", alignItems:"center", justifyContent:"center", backdropFilter:"blur(8px)" }}>
            <div onClick={e=>e.stopPropagation()} style={{ background:T.c1, border:`1px solid ${T.ln2}`, borderRadius:T.rL, padding:"1.5rem", width:400, maxWidth:"90vw" }}>
              {children}
            </div>
          </div>;
        }

        function SL({ children }) { return <p style={{ margin:"0 0 .75rem", fontSize:11, fontWeight:600, color:T.t3, textTransform:"uppercase", letterSpacing:".05em" }}>{children}</p>; }

        // Inline quick-editable row container
        function EditableRow({ value, onSave, label, type="text" }) {
          const [editing, setEditing] = useState(false);
          const [val, setVal] = useState(value);
          if (editing) {
            return <div style={{ display: "flex", gap: 6, width: "100%" }}>
              <FI type={type} value={val} onChange={e => setVal(e.target.value)} style={{ padding: "4px 8px", fontSize: 12 }} />
              <Btn v="primary" style={{ padding: "4px 8px", fontSize: 11 }} onClick={() => { onSave(type==="number" ? Number(val) : val); setEditing(false); }}>Save</Btn>
              <Btn v="ghost" style={{ padding: "4px 8px", fontSize: 11 }} onClick={() => { setVal(value); setEditing(false); }}>X</Btn>
            </div>;
          }
          return <span onClick={() => setEditing(true)} style={{ cursor: "pointer", borderBottom: "1px dashed #52525b" }} title="Click to change">{label || value}</span>;
        }

        // ── NAVIGATION BAR
        const PAGES = [
          { id:"home", icon:"ti-layout-dashboard", label:"Dashboard" },
          { id:"clients", icon:"ti-users", label:"Clients" },
          { id:"projects", icon:"ti-layout-kanban", label:"Projects" },
          { id:"finance", icon:"ti-chart-bar", label:"Earnings" },
          { id:"expenses", icon:"ti-receipt", label:"Expenses" },
          { id:"calendar", icon:"ti-calendar", label:"Calendar" },
          { id:"templates", icon:"ti-template", label:"Templates" },
          { id:"delivery", icon:"ti-package", label:"Delivery" },
          { id:"timer", icon:"ti-clock", label:"Time Tracker" },
          { id:"portfolio", icon:"ti-player-play", label:"Portfolio" },
        ];

        function Nav({ page, setPage }) {
          return <div style={{ display:"flex", gap:4, padding:"0 0 1rem", borderBottom:`1px solid ${T.ln}`, marginBottom: "1.5rem", flexWrap:"wrap" }}>
            {PAGES.map(n => {
              const a = page===n.id;
              return <button key={n.id} onClick={()=>setPage(n.id)} style={{ display:"flex", alignItems:"center", gap:6, padding:"6px 12px", borderRadius:T.r, background:a?T.acs:"transparent", color:a?T.ac:T.t2, border: a ? `1px solid rgba(224,86,56,0.2)` : '1px solid transparent', fontSize:12, fontWeight:a?600:400, cursor:"pointer", transition:"all .15s", fontFamily:T.ff }}>
                <i className={`ti ${n.icon}`} style={{ fontSize:14 }} />{n.label}
              </button>;
            })}
          </div>;
        }

        // ── MAIN APPLICATION
        function EditDesk() {
          const [page, setPage] = useState("home");

          // ── SYSTEM APP STATES (Hydrated from LocalStorage)
          const [clients, setClients] = useState(() => loadData("clients", [
            { id: 1, name: "Alex Rivera", type: "YouTube" },
            { id: 2, name: "Zoe Chen", type: "Instagram" }
          ]));
          const [projects, setProjects] = useState(() => loadData("projects", [
            { id: 1, title: "Episode 47 — Tech Talk", client: "Alex Rivera", status: "In Progress", value: 850 },
            { id: 2, title: "May Lifestyle Reel", client: "Zoe Chen", status: "Review", value: 600 }
          ]));
          const [logs, setLogs] = useState(() => loadData("logs", [
            { id: 1, client: "Alex Rivera", task: "Rough Assembly Cut", duration: 5400, date: "May 15" }
          ]));
          const [earnings, setEarnings] = useState(() => loadData("earnings", [
            { id: 1, month: "May", amount: 3250 },
            { id: 2, month: "April", amount: 4050 }
          ]));
          const [expenses, setExpenses] = useState(() => loadData("expenses", [
            { id: 1, name: "Adobe Creative Cloud", amount: 54.99, cat: "Software" },
            { id: 2, name: "Epidemic Sound", amount: 15.00, cat: "Music" }
          ]));
          const [budget, setBudget] = useState(() => loadData("budget", 500));
          const [calendar, setCalendar] = useState(() => loadData("calendar", { "12": "Doc Cut Due", "15": "Tech Talk Launch Day" }));
          const [templates, setTemplates] = useState(() => loadData("templates", [
            { id: 1, title: "Project delivered", body: "Hi {name}, your project edit files are fully rendered and ready! Download folder linked here: {link}" },
            { id: 2, title: "Revision received", body: "Hi {name}, notes received! I will begin adjusting the layout and timelines and have version 2 over shortly." }
          ]));
          const [delivery, setDelivery] = useState(() => loadData("delivery", [
            { id: 1, client: "Alex Rivera — Episode 47", url: "https://frame.io/share/node-x78b" }
          ]));
          const [portfolio, setPortfolio] = useState(() => loadData("portfolio", [
            { id: 1, title: "AI Tools Workflow Video", client: "Alex Rivera", views: "284K", url: "https://youtube.com" }
          ]));

          // Sync loops to save state modifications instantly
          useEffect(() => { saveData("clients", clients); }, [clients]);
          useEffect(() => { saveData("projects", projects); }, [projects]);
          useEffect(() => { saveData("logs", logs); }, [logs]);
          useEffect(() => { saveData("earnings", earnings); }, [earnings]);
          useEffect(() => { saveData("expenses", expenses); }, [expenses]);
          useEffect(() => { saveData("budget", budget); }, [budget]);
          useEffect(() => { saveData("calendar", calendar); }, [calendar]);
          useEffect(() => { saveData("templates", templates); }, [templates]);
          useEffect(() => { saveData("delivery", delivery); }, [delivery]);
          useEffect(() => { saveData("portfolio", portfolio); }, [portfolio]);

          // Modal Forms Controls
          const [modalType, setModalType] = useState(null);
          const [formData, setFormData] = useState({});

          // Total Stats
          const totalSpentThisMonth = expenses.reduce((acc, curr) => acc + curr.amount, 0);

          // Render view controller
          return (
            <div style={{ fontFamily: T.ff, color: T.tx, padding: '30px 20px', maxWidth: '960px', margin: '0 auto' }}>
              <header style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: "20px" }}>
                <h1 style={{ fontSize: '20px', fontWeight: '700', letterSpacing:"-.02em" }}>EditDesk <span style={{color: T.ac}}>Pro</span></h1>
                <div style={{ fontSize: 12, color: T.t2 }}>Production Workspace Engine</div>
              </header>

              <Nav page={page} setPage={setPage} />

              <main style={{ minHeight: "60vh" }}>
                
                {/* ── HOME / DASHBOARD VIEW ── */}
                {page === "home" && (
                  <div>
                    <div style={{ display:"grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: "1.5rem" }}>
                      <Card><SL>Total Active Clients</SL><p style={{ fontSize: 24, fontWeight: 700, margin: 0 }}>{clients.length}</p></Card>
                      <Card><SL>Logged Edit Shifts</SL><p style={{ fontSize: 24, fontWeight: 700, margin: 0 }}>{logs.length} sessions</p></Card>
                      <Card><SL>Active Review Pipelines</SL><p style={{ fontSize: 24, fontWeight: 700, margin: 0 }}>{delivery.length} pipelines</p></Card>
                    </div>
                    <Card>
                      <SL>Overview Quick Portal</SL>
                      <p style={{ margin: "0 0 12px", fontSize: 13, color: T.t2 }}>Welcome to your workspace. Use the navigational layout map above to fully configure, edit, add, or delete targets across your active studio deployment.</p>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        {PAGES.filter(p=>p.id!=="home").map(p => <Btn key={p.id} onClick={() => setPage(p.id)}><i className={`ti ${p.icon}`} />{p.label}</Btn>)}
                      </div>
                    </Card>
                  </div>
                )}

                {/* ── CLIENTS VIEW ── */}
                {page === "clients" && (
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem", alignItems: "center" }}>
                      <h2 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Clients Registry</h2>
                      <Btn v="primary" onClick={() => { setFormData({ name: "", type: "YouTube" }); setModalType("client"); }}><i className="ti ti-plus" />Add Client</Btn>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {clients.map((c, i) => (
                        <Card key={c.id} style={{ display: "flex", alignItems: "center", justifyBetween: "space-between", gap: 12 }}>
                          <Av label={c.name.slice(0,2).toUpperCase()} idx={i} />
                          <div style={{ flex: 1 }}>
                            <p style={{ margin: 0, fontWeight: 600, fontSize: 14 }}>
                              <EditableRow value={c.name} onSave={val => setClients(clients.map(x => x.id === c.id ? { ...x, name: val } : x))} />
                            </p>
                            <p style={{ margin: 0, fontSize: 11, color: T.t3 }}>
                              Platform Strategy: <EditableRow value={c.type} onSave={val => setClients(clients.map(x => x.id === c.id ? { ...x, type: val } : x))} />
                            </p>
                          </div>
                          <Btn v="delSmall" onClick={() => setClients(clients.filter(x => x.id !== c.id))}><i className="ti ti-trash" /></Btn>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}

                {/* ── PROJECTS VIEW ── */}
                {page === "projects" && (
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem", alignItems: "center" }}>
                      <h2 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Active Project Timelines</h2>
                      <Btn v="primary" onClick={() => { setFormData({ title: "", client: clients[0]?.name || "Generic Client", status: "In Progress", value: 500 }); setModalType("project"); }}><i className="ti ti-plus" />Add Project</Btn>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {projects.map(p => (
                        <Card key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div style={{ flex: 1 }}>
                            <p style={{ margin: 0, fontWeight: 600, fontSize: 14 }}>
                              <EditableRow value={p.title} onSave={val => setProjects(projects.map(x => x.id === p.id ? { ...x, title: val } : x))} />
                            </p>
                            <p style={{ margin: 0, fontSize: 11, color: T.t3 }}>
                              Client: {p.client} • Status: <EditableRow value={p.status} onSave={val => setProjects(projects.map(x => x.id === p.id ? { ...x, status: val } : x))} />
                            </p>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                            <p style={{ margin: 0, fontWeight: 700, fontSize: 14 }}>
                              $<EditableRow type="number" value={p.value} label={p.value.toLocaleString()} onSave={val => setProjects(projects.map(x => x.id === p.id ? { ...x, value: val } : x))} />
                            </p>
                            <Btn v="delSmall" onClick={() => setProjects(projects.filter(x => x.id !== p.id))}><i className="ti ti-trash" /></Btn>
                          </div>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}

                {/* ── EARNINGS VIEW ── */}
                {page === "finance" && (
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem", alignItems: "center" }}>
                      <h2 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Revenue Statements</h2>
                      <Btn v="primary" onClick={() => { setFormData({ month: "May", amount: 1000 }); setModalType("earning"); }}><i className="ti ti-plus" />Log Income</Btn>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {earnings.map(e => (
                        <Card key={e.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div>
                            <p style={{ margin: 0, fontWeight: 600, fontSize: 14 }}>
                              <EditableRow value={e.month} onSave={val => setEarnings(earnings.map(x => x.id === e.id ? { ...x, month: val } : x))} /> Ledger Entry
                            </p>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                            <p style={{ margin: 0, fontWeight: 700, color: T.gr, fontSize: 14 }}>
                              $<EditableRow type="number" value={e.amount} label={e.amount.toLocaleString()} onSave={val => setEarnings(earnings.map(x => x.id === e.id ? { ...x, amount: val } : x))} />
                            </p>
                            <Btn v="delSmall" onClick={() => setEarnings(earnings.filter(x => x.id !== e.id))}><i className="ti ti-trash" /></Btn>
                          </div>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}

                {/* ── EXPENSES VIEW ── */}
                {page === "expenses" && (
                  <div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: "1.5rem" }}>
                      <Card>
                        <SL>Total Capital Spent This Month</SL>
                        <p style={{ fontSize: 26, fontWeight: 700, margin: 0, color: T.re }}>${totalSpentThisMonth.toFixed(2)}</p>
                      </Card>
                      <Card>
                        <SL>Remaining Operational Budget</SL>
                        <p style={{ fontSize: 26, fontWeight: 700, margin: 0, color: T.gr }}>
                          ${(budget - totalSpentThisMonth).toFixed(2)}
                        </p>
                        <p style={{ margin: "4px 0 0", fontSize: 11, color: T.t3 }}>
                          Cap Ceiling Limit: $<EditableRow type="number" value={budget} label={String(budget)} onSave={val => setBudget(val)} />
                        </p>
                      </Card>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem", alignItems: "center" }}>
                      <h2 style={{ fontSize: 14, fontWeight: 700, color: T.t2, margin: 0 }}>Line Item Deductions</h2>
                      <Btn v="primary" onClick={() => { setFormData({ name: "", amount: 10, cat: "Software" }); setModalType("expense"); }}><i className="ti ti-plus" />Add Expense</Btn>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {expenses.map(exp => (
                        <Card key={exp.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div>
                            <p style={{ margin: 0, fontWeight: 600, fontSize: 14 }}>
                              <EditableRow value={exp.name} onSave={val => setExpenses(expenses.map(x => x.id === exp.id ? { ...x, name: val } : x))} />
                            </p>
                            <p style={{ margin: 0, fontSize: 11, color: T.t3 }}>
                              Category classification: <EditableRow value={exp.cat} onSave={val => setExpenses(expenses.map(x => x.id === exp.id ? { ...x, cat: val } : x))} />
                            </p>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                            <p style={{ margin: 0, fontWeight: 700, fontSize: 14 }}>
                              $<EditableRow type="number" value={exp.amount} label={exp.amount.toFixed(2)} onSave={val => setExpenses(expenses.map(x => x.id === exp.id ? { ...x, amount: val } : x))} />
                            </p>
                            <Btn v="delSmall" onClick={() => setExpenses(expenses.filter(x => x.id !== exp.id))}><i className="ti ti-trash" /></Btn>
                          </div>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}

                {/* ── CALENDAR VIEW ── */}
                {page === "calendar" && (
                  <div>
                    <h2 style={{ fontSize: 18, fontWeight: 700, marginBottom: "1rem" }}>Interactive Production Deadlines Matrix</h2>
                    <Card>
                      <SL>Click any number date frame box to map or update a delivery notice note</SL>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, textAlign: "center" }}>
                        {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => <div key={d} style={{ fontSize: 11, fontWeight: 600, color: T.t4 }}>{d}</div>)}
                        {Array.from({ length: 28 }).map((_, n) => {
                          const dayString = String(n + 1);
                          const currentNote = calendar[dayString] || "";
                          return (
                            <div key={n} onClick={() => {
                              const notePrompt = prompt(`Update custom text item statement for Day Frame Block ${dayString}:`, currentNote);
                              if (notePrompt !== null) {
                                if (notePrompt.trim() === "") {
                                  const updatedCal = { ...calendar }; delete updatedCal[dayString]; setCalendar(updatedCal);
                                } else {
                                  setCalendar({ ...calendar, [dayString]: notePrompt });
                                }
                              }
                            }}
                              style={{ background: currentNote ? T.acs : "rgba(255,255,255,0.01)", border: currentNote ? `1px solid ${T.ac}` : `1px solid ${T.ln}`, padding: "10px 4px", borderRadius: T.r, cursor: "pointer", minHeight: 65, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
                              <span style={{ fontSize: 12, fontWeight: 600, color: currentNote ? T.ac : T.t3 }}>{dayString}</span>
                              {currentNote && <span style={{ fontSize: 9, color: T.tx, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", padding: "0 2px" }}>{currentNote}</span>}
                            </div>
                          );
                        })}
                      </div>
                    </Card>
                  </div>
                )}

                {/* ── TEMPLATES VIEW ── */}
                {page === "templates" && (
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem", alignItems: "center" }}>
                      <h2 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Clipboard Compositions</h2>
                      <Btn v="primary" onClick={() => { setFormData({ title: "", body: "" }); setModalType("template"); }}><i className="ti ti-plus" />Add Template</Btn>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      {templates.map(t => (
                        <Card key={t.id} style={{ display: "flex", flexDirection: "column", justifyContent: "space-between", gap: 12 }}>
                          <div>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                              <SL><EditableRow value={t.title} onSave={val => setTemplates(templates.map(x => x.id === t.id ? { ...x, title: val } : x))} /></SL>
                              <Btn v="delSmall" onClick={() => setTemplates(templates.filter(x => x.id !== t.id))}><i className="ti ti-trash" /></Btn>
                            </div>
                            <p style={{ margin: 0, fontSize: 13, color: T.t2, lineHeight: 1.5, background: T.c2, padding: 8, borderRadius: T.r, border: `1px dashed ${T.ln}` }}>
                              <EditableRow value={t.body} onSave={val => setTemplates(templates.map(x => x.id === t.id ? { ...x, body: val } : x))} />
                            </p>
                          </div>
                          <Btn v="ghost" style={{ alignSelf: "flex-start" }} onClick={() => { navigator.clipboard.writeText(t.body); alert("Copied Boilerplate array sequence to clipboard context!"); }}>
                            <i className="ti ti-copy" />Copy String Link
                          </Btn>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}

                {/* ── DELIVERY HUB VIEW ── */}
                {page === "delivery" && (
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem", alignItems: "center" }}>
                      <h2 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Export & Review Safe Node Pipelines</h2>
                      <Btn v="primary" onClick={() => { setFormData({ client: "", url: "" }); setModalType("delivery"); }}><i className="ti ti-plus" />Add Pipeline Node</Btn>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {delivery.map(d => (
                        <Card key={d.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div style={{ flex: 1, marginRight: 16 }}>
                            <SL>
                              <EditableRow value={d.client} onSave={val => setDelivery(delivery.map(x => x.id === d.id ? { ...x, client: val } : x))} />
                            </SL>
                            <FI value={d.url} onChange={e => setDelivery(delivery.map(x => x.id === d.id ? { ...x, url: e.target.value } : x))} style={{ fontSize: 11, padding: "5px 10px", fontFamily: "monospace" }} />
                          </div>
                          <div style={{ display: "flex", gap: 6 }}>
                            <Btn v="ghost" onClick={() => window.open(d.url, '_blank')}><i className="ti ti-external-link" /></Btn>
                            <Btn v="delSmall" onClick={() => setDelivery(delivery.filter(x => x.id !== d.id))}><i className="ti ti-trash" /></Btn>
                          </div>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}

                {/* ── TIME TRACKER ENGINE VIEW ── */}
                {page === "timer" && (
                  <TimeTrackerView clients={clients} logs={logs} setLogs={setLogs} />
                )}

                {/* ── PORTFOLIO STRATEGY VIEW ── */}
                {page === "portfolio" && (
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "1rem", alignItems: "center" }}>
                      <h2 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Public Project Showreel Portfolio</h2>
                      <Btn v="primary" onClick={() => { setFormData({ title: "", client: "", views: "10K", url: "" }); setModalType("portfolio"); }}><i className="ti ti-plus" />Add Project Track</Btn>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      {portfolio.map(p => (
                        <Card key={p.id} style={{ display:"flex", flexDirection:"column", justifyContent:"space-between", minHeight: 130 }}>
                          <div>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                              <Chip color="ac">Live Assets</Chip>
                              <Btn v="delSmall" onClick={() => setPortfolio(portfolio.filter(x => x.id !== p.id))}><i className="ti ti-trash" /></Btn>
                            </div>
                            <h4 style={{ margin: "8px 0 2px", fontSize: 14, fontWeight: 600 }}>
                              <EditableRow value={p.title} onSave={val => setPortfolio(portfolio.map(x => x.id === p.id ? { ...x, title: val } : x))} />
                            </h4>
                            <p style={{ margin: "0 0 8px", fontSize: 11, color: T.t3 }}>
                              Client: <EditableRow value={p.client} onSave={val => setPortfolio(portfolio.map(x => x.id === p.id ? { ...x, client: val } : x))} /> • Metrics: <EditableRow value={p.views} onSave={val => setPortfolio(portfolio.map(x => x.id === p.id ? { ...x, views: val } : x))} /> views
                            </p>
                          </div>
                          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                            <FI value={p.url} onChange={e => setPortfolio(portfolio.map(x => x.id === p.id ? { ...x, url: e.target.value } : x))} style={{ fontSize: 11, padding: "4px 8px" }} />
                            <Btn v="ghost" style={{ padding: "6px 10px" }} onClick={() => window.open(p.url, '_blank')}><i className="ti ti-external-link" /></Btn>
                          </div>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}

              </main>

              {/* ── CENTRAL CREATIVE POPUP MODAL DIALOG ENGINE ── */}
              {modalType && (
                <Modal onClose={() => setModalType(null)}>
                  <p style={{ margin: "0 0 1rem", fontSize: 15, fontWeight: 700 }}>New Asset Profile Configurator</p>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {modalType === "client" && (
                      <>
                        <FI placeholder="Client Name Name" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                        <FI placeholder="Channel/Media Context Platform" value={formData.type} onChange={e => setFormData({ ...formData, type: e.target.value })} />
                        <Btn v="primary" onClick={() => { setClients([...clients, { id: Date.now(), ...formData }]); setModalType(null); }}>Save Index</Btn>
                      </>
                    )}
                    {modalType === "project" && (
                      <>
                        <FI placeholder="Project Title Name" value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} />
                        <FI placeholder="Assigned Client" value={formData.client} onChange={e => setFormData({ ...formData, client: e.target.value })} />
                        <FI type="number" placeholder="Budget Valuation Contract Rate" value={formData.value} onChange={e => setFormData({ ...formData, value: Number(e.target.value) })} />
                        <Btn v="primary" onClick={() => { setProjects([...projects, { id: Date.now(), ...formData }]); setModalType(null); }}>Save Timeline Matrix</Btn>
                      </>
                    )}
                    {modalType === "earning" && (
                      <>
                        <FI placeholder="Target Month Ledger Frame" value={formData.month} onChange={e => setFormData({ ...formData, month: e.target.value })} />
                        <FI type="number" placeholder="Financial Payout Yield Statement" value={formData.amount} onChange={e => setFormData({ ...formData, amount: Number(e.target.value) })} />
                        <Btn v="primary" onClick={() => { setEarnings([...earnings, { id: Date.now(), ...formData }]); setModalType(null); }}>Commit Financial entry</Btn>
                      </>
                    )}
                    {modalType === "expense" && (
                      <>
                        <FI placeholder="Asset Name" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                        <FI type="number" placeholder="Cost Balance Value" value={formData.amount} onChange={e => setFormData({ ...formData, amount: Number(e.target.value) })} />
                        <FI placeholder="Operational Field Classification Category" value={formData.cat} onChange={e => setFormData({ ...formData, cat: e.target.value })} />
                        <Btn v="primary" onClick={() => { setExpenses([...expenses, { id: Date.now(), ...formData }]); setModalType(null); }}>Inject Item Entry</Btn>
                      </>
                    )}
                    {modalType === "template" && (
                      <>
                        <FI placeholder="Template Header Title" value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} />
                        <textarea placeholder="Message Boilerplate Block string content text layout details" value={formData.body} onChange={e => setFormData({ ...formData, body: e.target.value })} style={{ background: T.c2, border:`1px solid ${T.ln}`, borderRadius: T.r, color: T.tx, padding: 8, height: 100, outline: "none", fontSize: 13 }} />
                        <Btn v="primary" onClick={() => { setTemplates([...templates, { id: Date.now(), ...formData }]); setModalType(null); }}>Inject Composition Card</Btn>
                      </>
                    )}
                    {modalType === "delivery" && (
                      <>
                        <FI placeholder="Client Frame Sequence Definition Descriptor" value={formData.client} onChange={e => setFormData({ ...formData, client: e.target.value })} />
                        <FI placeholder="Secure Target Hyperlink Destination URL String" value={formData.url} onChange={e => setFormData({ ...formData, url: e.target.value })} />
                        <Btn v="primary" onClick={() => { setDelivery([...delivery, { id: Date.now(), ...formData }]); setModalType(null); }}>Mount Review Frame Link</Btn>
                      </>
                    )}
                    {modalType === "portfolio" && (
                      <>
                        <FI placeholder="Public Showcase Title" value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} />
                        <FI placeholder="Client attribution descriptor" value={formData.client} onChange={e => setFormData({ ...formData, client: e.target.value })} />
                        <FI placeholder="Public Video URL" value={formData.url} onChange={e => setFormData({ ...formData, url: e.target.value })} />
                        <Btn v="primary" onClick={() => { setPortfolio([...portfolio, { id: Date.now(), ...formData }]); setModalType(null); }}>Bind Reel Entry</Btn>
                      </>
                    )}
                  </div>
                </Modal>
              )}
            </div>
          );
        }

        // ── ISOLATED TIMING ENGINE SUB-INTERACTION CONTROLLER
        function TimeTrackerView({ clients, logs, setLogs }) {
          const [active, setActive] = useState(false);
          const [sec, setSec] = useState(0);
          const [clientSel, setClientSel] = useState(clients[0]?.name || "General Cut Timeline");
          const [taskNote, setTaskNote] = useState("Sound Splicing Work & Adjustments");

          useEffect(() => {
            let t = null;
            if (active) { t = setInterval(() => setSec(s => s + 1), 1000); } 
            else { clearInterval(t); }
            return () => clearInterval(t);
          }, [active]);

          return (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, alignItems: "start" }}>
              <Card style={{ padding: "1.5rem" }}>
                <SL>Production Shift Counter Stop Watch</SL>
                <div style={{ fontSize: 44, fontWeight: 300, fontFamily: "monospace", color: active ? T.ac : T.tx, margin: "0.5rem 0 1rem", letterSpacing: "-0.04em" }}>
                  {fmtSec(sec)}
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: "1rem" }}>
                  <div>
                    <label style={{ fontSize: 11, color: T.t2, display: "block", marginBottom: 4 }}>Client Target Anchor</label>
                    <FS value={clientSel} onChange={e => setClientSel(e.target.value)}>
                      {clients.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                      <option value="General Cut Timeline">Unlisted General Cut</option>
                    </FS>
                  </div>
                  <div>
                    <label style={{ fontSize: 11, color: T.t2, display: "block", marginBottom: 4 }}>Edit Phase Note Description</label>
                    <FI value={taskNote} onChange={e => setTaskNote(e.target.value)} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <Btn v={active ? "danger" : "primary"} onClick={() => setActive(!active)}>
                    <i className={`ti ${active ? "ti-player-pause" : "ti-player-play"}`} /> {active ? "Freeze Session" : "Initiate Shift Counter"}
                  </Btn>
                  {sec > 0 && (
                    <Btn v="ghost" style={{ borderColor: T.gr, color: T.gr }} onClick={() => {
                      setLogs([{ id: Date.now(), client: clientSel, task: taskNote, duration: sec, date: "Today" }, ...logs]);
                      setSec(0); setActive(false);
                    }}><i className="ti ti-archive" /> Log Proof of Work</Btn>
                  )}
                </div>
              </Card>

              <Card>
                <SL>Recorded Production Audit (Proof of Work Archive Logs)</SL>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 310, overflowY: "auto" }}>
                  {logs.map(l => (
                    <div key={l.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.c2, padding: "8px 12px", borderRadius: T.r, border: `1px solid ${T.ln}` }}>
                      <div>
                        <p style={{ margin: 0, fontSize: 13, fontWeight: 600 }}>
                          <EditableRow value={l.task} onSave={val => setLogs(logs.map(x => x.id === l.id ? { ...x, task: val } : x))} />
                        </p>
                        <p style={{ margin: 0, fontSize: 11, color: T.t3 }}>
                          {l.client} • {l.date}
                        </p>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <span style={{ fontSize: 12, fontFamily: "monospace", fontWeight: 700, color: T.bl }}>{fmtSec(l.duration)}</span>
                        <Btn v="delSmall" onClick={() => setLogs(logs.filter(x => x.id !== l.id))}><i className="ti ti-trash" /></Btn>
                      </div>
                    </div>
                  ))}
                  {logs.length === 0 && <p style={{ fontSize: 12, color: T.t3, margin: 0, textAlign: "center", padding: "2rem" }}>Audit log list clears empty.</p>}
                </div>
              </Card>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EditDesk />);
    </script>
</body>
</html>
